          class $C { ... void Dispose() { ... } ... }
      - pattern-not-inside: |
          class $C { ... void Dispose() { ... $F.Dispose(); ... } ... }
      - pattern-not-inside: |
          class $C { ... void Dispose() { ... $F?.Dispose(); ... } ... }
      - pattern-not-inside: |
          class $C { ... void Dispose() { ... $F.Close(); ... } ... }
      - pattern-not-inside: |
          class $C { ... void Dispose(bool $B) { ... $F.Dispose(); ... } ... }
      - pattern-not-inside: |
          class $C { ... void Dispose(bool $B) { ... $F?.Dispose(); ... } ... }
      - pattern-not-inside: |
          class $C { ... void Dispose(bool $B) { ... $F.Close(); ... } ... }
      - pattern-either:
          - pattern: $T $F = new $D(...);
          - pattern: $F = new $D(...)
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.dispose-method-without-idisposable
    severity: WARNING
    languages:
      - csharp
    message: >-
      Implement IDisposable in this class, or rename this 'Dispose' method.
      A method named Dispose in a class that is not disposable is misleading: it is not called by using statements.
    patterns:
      - pattern: |
          class $C { ... $R $D() { ... } ... }
      - metavariable-regex:
          metavariable: $D
          regex: '^Dispose$'
      - pattern-not: |
          class $C : $B { ... }
      - pattern-not: |
          class $C : $B, $I { ... }
      - pattern-not: |
          class $C : $B, $I, $J { ... }
      - pattern-not: |
          class $C : $B, $I, $J, $K { ... }
      - focus-metavariable: $D
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.correctness.assertion-arguments-order
    severity: WARNING
    languages:
      - csharp
    message: >-
      Swap these assertion arguments, the expected value must be passed first.
      With the arguments reversed, failure messages report the actual value as the expected one.
    patterns:
      - pattern-either:
          - pattern: Assert.AreEqual($ACTUAL, $EXPECTED, ...)
          - pattern: Assert.AreNotEqual($ACTUAL, $EXPECTED, ...)
          - pattern: Assert.AreSame($ACTUAL, $EXPECTED, ...)
          - pattern: Assert.AreNotSame($ACTUAL, $EXPECTED, ...)
          - pattern: Assert.Equal($ACTUAL, $EXPECTED, ...)
          - pattern: Assert.NotEqual($ACTUAL, $EXPECTED, ...)
          - pattern: Assert.Same($ACTUAL, $EXPECTED, ...)
          - pattern: Assert.NotSame($ACTUAL, $EXPECTED, ...)
      - metavariable-regex:
          metavariable: $EXPECTED
          regex: '^(?:-?\d[\w.]*|@?"(?:[^"\\]|\\.)*"|''(?:[^''\\]|\\.)+''|true|false|null)$'
      - metavariable-regex:
          metavariable: $ACTUAL
          regex: '^(?!(?:-?\d[\w.]*|@?"(?:[^"\\]|\\.)*"|''(?:[^''\\]|\\.)+''|true|false|null)$)'
    options:
      constant_propagation: false
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.invalid-test-method-signature
    severity: ERROR
    languages:
      - csharp
    message: >-
      Make this test method public, non-generic and returning void or Task.
      Test frameworks silently ignore test methods with an unsupported signature.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      [TestMethod]
                      $R $M(...) { ... }
                  - pattern: |
                      [DataTestMethod]
                      $R $M(...) { ... }
                  - pattern: |
                      [Test]
                      $R $M(...) { ... }
                  - pattern: |
                      [TestCase(...)]
                      $R $M(...) { ... }
              - pattern-not: |
                  [TestMethod]
                  public $R $M(...) { ... }
              - pattern-not: |
                  [DataTestMethod]
                  public $R $M(...) { ... }
              - pattern-not: |
                  [Test]
                  public $R $M(...) { ... }
              - pattern-not: |
                  [TestCase(...)]
                  public $R $M(...) { ... }
          - pattern: |
              [TestMethod]
              async void $M(...) { ... }
          - pattern: |
              [DataTestMethod]
              async void $M(...) { ... }
          - pattern: |
              [Test]
              async void $M(...) { ... }
          - pattern: |
              [Fact]
              async void $M(...) { ... }
          - pattern: |
              [Theory]
              async void $M(...) { ... }
          - pattern: |
              [TestMethod]
              $R $M<$T>(...) { ... }
      - focus-metavariable: $M
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.service-contract-without-operations
    severity: ERROR
    languages:
      - csharp
    message: >-
      Add at least one [OperationContract] method to this [ServiceContract] type.
      A service contract without operations exposes nothing to the clients of the service.
    pattern-regex: '\[[ \t]*ServiceContract\b[^\]]*\]\s*(?:\[[^\]]*\]\s*)*(?:(?:public|internal)[ \t]+)?(?:interface|class)[ \t]+\K\w+(?![^{]*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?\[[ \t]*OperationContract\b)'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.best-practice.one-way-operation-returns-value
    severity: INFO
    languages:
      - csharp
    message: >-
      Make this one-way operation return void.
      One-way operations do not send a response, so their return value is never received by the caller.
    pattern-regex: '\[[ \t]*OperationContract[ \t]*\((?![^)]*AsyncPattern[ \t]*=[ \t]*true)[^)]*IsOneWay[ \t]*=[ \t]*true[^)]*\)[ \t]*\]\s*(?:(?:public|internal)[ \t]+)?(?!void\b)[\w.<>\[\],?]+[ \t]+\K\w+'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.correctness.params-added-on-override
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove the 'params' modifier from this override.
      The modifier has no effect on overrides and misleads callers into thinking they can pass a variable number of arguments.
    pattern-regex: '\boverride\b[^;{(=]*\((?:[^()]*,)?[ \t]*\Kparams\b'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.pure-method-returns-void
    severity: ERROR
    languages:
      - csharp
    message: >-
      Remove the [Pure] attribute from this method, or make it return a value.
      A pure method has no side effects, so a pure method returning void does nothing useful.
    pattern-regex: '\[[ \t]*(?:System\.Diagnostics\.Contracts\.)?Pure(?:Attribute)?[ \t]*\]\s*(?://[^\n]*\s*)*(?:\[[^\]]*\]\s*)*(?:(?:public|private|protected|internal|static|virtual|override|sealed)[ \t]+)*void[ \t]+\K\w+'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.nullable-gettype-comparison
    severity: ERROR
    languages:
      - csharp
    message: >-
      Remove this comparison of GetType() with a Nullable type, it is always false.
      GetType() on a nullable value returns the underlying type, never Nullable<T>.
    pattern-regex: '\.GetType\(\)\s*[!=]=\s*typeof\(\s*(?:(?:System\.)?Nullable<[^>]+>|[\w.]+\?)\s*\)|typeof\(\s*(?:(?:System\.)?Nullable<[^>]+>|[\w.]+\?)\s*\)\s*[!=]=\s*[\w.]+\.GetType\(\)'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.nullable-value-without-check
    severity: ERROR
    languages:
      - csharp
    message: >-
      Check that this nullable variable has a value before accessing '.Value'.
      Accessing '.Value' on an empty nullable throws an InvalidOperationException.
    patterns:
      - pattern-either:
          - pattern-inside: |
              $T? $X = null;
              ...
          - patterns:
              - pattern-inside: |
                  $T? $X = $E;
                  ...
              - metavariable-pattern:
                  metavariable: $E
                  pattern-either:
                    - pattern: "$C ? $A : null"
                    - pattern: "$C ? null : $A"
      - pattern: $X.Value
      - pattern-not-inside: |
          $X = $Y;
          ...
      - pattern-not-inside: if (<... $X.HasValue ...>) $S;
      - pattern-not-inside: if (<... $X != null ...>) $S;
      - pattern-not-inside: if (<... $X is not null ...>) $S;
      - pattern-not-inside: $X.HasValue && $E
      - pattern-not-inside: $X != null && $E
      - pattern-not-inside: "$X.HasValue ? $A : $B"
      - pattern-not-inside: "$X != null ? $A : $B"
      - pattern-not-inside: |
          if (!$X.HasValue) { ... return ...; }
          ...
      - pattern-not-inside: |
          if ($X == null) { ... return ...; }
          ...
      - pattern-not-inside: |
          if (!$X.HasValue) { ... throw ...; }
          ...
      - pattern-not-inside: |
          if ($X == null) { ... throw ...; }
          ...
    options:
      constant_propagation: false
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.not-implemented-exception
    severity: WARNING
    languages:
      - csharp
    message: >-
      Implement this functionality instead of throwing NotImplementedException.
      NotImplementedException marks unfinished code that will fail at runtime.
    pattern-either:
      - pattern: new NotImplementedException(...)
      - pattern: new System.NotImplementedException(...)
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.exception-thrown-from-unexpected-method
    severity: ERROR
    languages:
      - csharp
    message: >-
      Remove this 'throw' statement from a method that is not expected to throw.
      ToString, Equals, GetHashCode, Dispose, equality and implicit conversion operators, static constructors and event accessors should not throw exceptions.
    patterns:
      - pattern: throw $E;
      - pattern-not: throw new NotImplementedException(...);
      - pattern-not: throw new System.NotImplementedException(...);
      - pattern-either:
          - pattern-inside: |
              override string ToString() { ... }
          - pattern-inside: |
              override bool Equals($T $O) { ... }
          - pattern-inside: |
              bool Equals($T $O) { ... }
          - pattern-inside: |
              override int GetHashCode() { ... }
          - pattern-inside: |
              void Dispose() { ... }
          - patterns:
              - pattern-regex: '\boperator[ \t]*(?:==|!=)[ \t]*\([^)]*\)\s*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
          - patterns:
              - pattern-regex: '\bimplicit[ \t]+operator\b[^{;]*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
          - patterns:
              - pattern-regex: '(?m)^[ \t]*static[ \t]+\w+[ \t]*\([ \t]*\)\s*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
          - patterns:
              - pattern-regex: '\b(?:add|remove)\s*\{(?![^{}]*\bthrow[ \t]+new[ \t]+(?:System\.)?(?:InvalidOperation|NotSupported|Argument\w*)Exception\b)(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\}'
      - pattern-not-inside: |
          try { ... } catch ($T2 $V) { ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.assembly-load-from-path
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use Assembly.Load() instead of LoadFrom(), LoadFile() or LoadWithPartialName().
      These methods bypass the normal binding context and can load unexpected or duplicate versions of an assembly.
    pattern-either:
      - pattern: Assembly.LoadFrom(...)
      - pattern: Assembly.LoadFile(...)
      - pattern: Assembly.LoadWithPartialName(...)
      - pattern: System.Reflection.Assembly.LoadFrom(...)
      - pattern: System.Reflection.Assembly.LoadFile(...)
      - pattern: System.Reflection.Assembly.LoadWithPartialName(...)
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.thread-suspend-resume
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not use Thread.Suspend() or Thread.Resume(); use proper synchronization primitives instead.
      Suspending a thread at an arbitrary point can deadlock the application, and these methods are obsolete.
    pattern-either:
      - pattern: (Thread $T).Suspend()
      - pattern: (Thread $T).Resume()
      - pattern: Thread.CurrentThread.Suspend()
      - pattern: Thread.CurrentThread.Resume()
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.event-handler-signature
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use a delegate with the signature 'void (object sender, EventArgs e)' for this event.
      Event handlers following the standard signature work with the .NET event infrastructure and are expected by subscribers.
    patterns:
      - pattern-regex: '\bevent[ \t]+(\w+)[ \t]+\K\w+(?=[ \t]*;)'
      - pattern-regex: '\bdelegate[ \t]+(?!void[ \t]+(\w+)[ \t]*\([ \t]*object\??[ \t]+\w+[ \t]*,[ \t]*[\w.]+[ \t]+\w+[ \t]*\))[\w.<>]+[ \t]+(\w+)[ \t]*\([^)]*\)[\s\S]*?\bevent[ \t]+\2[ \t]+\w+[ \t]*;'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.iserializable-incorrect-implementation
    severity: ERROR
    languages:
      - csharp
    message: >-
      Implement ISerializable correctly: mark the type [Serializable] and add a serialization constructor.
      Without them, the runtime cannot serialize or deserialize instances of the type.
    pattern-either:
      - patterns:
          - pattern-regex: '\bclass[ \t]+\K\w+(?=[^{;]*:[^{;]*\bISerializable\b)'
          - pattern-not-inside: |
              class $C { ... $C(SerializationInfo $I, StreamingContext $X) { ... } ... }
          - pattern-not-inside: |
              class $C { ... $C(SerializationInfo $I, StreamingContext $X) : base(...) { ... } ... }
      - patterns:
          - pattern-regex: '\bclass[ \t]+\K\w+(?=[^{;]*:[^{;]*\bISerializable\b)'
          - pattern-not-inside: |
              [Serializable]
              class $C { ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.optional-field-without-deserialization-handler
    severity: ERROR
    languages:
      - csharp
    message: >-
      Add a deserialization event handler to initialize the [OptionalField] members of this class.
      Optional fields are not set when older serialized data is deserialized, so they keep their default values.
    patterns:
      - pattern-either:
          - pattern: |
              class $C { ... [OptionalField] $T $F; ... }
          - pattern: |
              class $C { ... [OptionalField(...)] $T $F; ... }
          - pattern: |
              class $C { ... [OptionalField] $T $F = $V; ... }
          - pattern: |
              class $C { ... [OptionalField(...)] $T $F = $V; ... }
      - pattern-not: |
          class $C { ... [OnDeserialized] $R $M(...) { ... } ... }
      - pattern-not: |
          class $C { ... [OnDeserializing] $R $M(...) { ... } ... }
      - focus-metavariable: $C
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.serialization-handler-signature
    severity: ERROR
    languages:
      - csharp
    message: >-
      Make this serialization event handler private, non-generic, returning void and taking a single StreamingContext parameter.
      Handlers with another signature are not called, or raise errors during serialization.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  [OnSerializing]
                  $R $M(...) { ... }
              - pattern-not: |
                  [OnSerializing]
                  private void $M(StreamingContext $C) { ... }
          - patterns:
              - pattern: |
                  [OnSerialized]
                  $R $M(...) { ... }
              - pattern-not: |
                  [OnSerialized]
                  private void $M(StreamingContext $C) { ... }
          - patterns:
              - pattern: |
                  [OnDeserializing]
                  $R $M(...) { ... }
              - pattern-not: |
                  [OnDeserializing]
                  private void $M(StreamingContext $C) { ... }
          - patterns:
              - pattern: |
                  [OnDeserialized]
                  $R $M(...) { ... }
              - pattern-not: |
                  [OnDeserialized]
                  private void $M(StreamingContext $C) { ... }
      - focus-metavariable: $M
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.argument-exception-parameter-name
    severity: ERROR
    languages:
      - csharp
    message: >-
      Pass the name of an existing parameter to the ArgumentException thrown by this method.
      An argument exception without a valid parameter name does not tell the caller which argument is wrong.
    pattern-either:
      - pattern: new ArgumentException()
      - pattern: new ArgumentNullException()
      - pattern: new ArgumentOutOfRangeException()
      - pattern-regex: '\b\K\w+[ \t]*(?:<[^<>()]*>)?[ \t]*\((?=[^()]*\)(?:\s*//[^\n]*)*\s*(?:where[^{]*)?\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*?\bnew[ \t]+(?:Argument(?:Null|OutOfRange)Exception[ \t]*\([ \t]*|ArgumentException[ \t]*\([ \t]*(?:[^,()]|\([^()]*\))+,[ \t]*)"(\w+)")(?![^()]*\b\1\b)'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.object-disposed-twice
    severity: ERROR
    languages:
      - csharp
    message: >-
      Remove this redundant Dispose() call, the object is already disposed.
      Disposing an object twice is a sign of confused ownership and some implementations throw ObjectDisposedException.
    pattern-either:
      - pattern-regex: '\b(\w+)\.Dispose\(\)[ \t]*;(?:(?!\b\1[ \t]*=[^=])(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\}))*?\K\b\1\.Dispose\(\)[ \t]*;'
      - pattern-regex: '\busing[ \t]*\([ \t]*(?:var|[\w.<>]+)[ \t]+(\w+)[ \t]*=[^;{]*\)\s*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?\K\b\1\.Dispose\(\)[ \t]*;'
      - pattern-regex: '\busing[ \t]+(?:var|[\w.<>]+)[ \t]+(\w+)[ \t]*=[^;]*;(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?\K\b\1\.Dispose\(\)[ \t]*;'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.suppress-finalize-outside-dispose
    severity: ERROR
    languages:
      - csharp
    message: >-
      Call GC.SuppressFinalize() only from a Dispose implementation.
      Suppressing finalization elsewhere can prevent unmanaged resources from ever being released.
    patterns:
      - pattern: GC.SuppressFinalize($X)
      - pattern-not-inside: |
          void Dispose() { ... }
      - pattern-not-inside: |
          void Dispose(bool $D) { ... }
      - pattern-not-inside: |
          ValueTask DisposeAsync() { ... }
      - pattern-not-inside: |
          Task DisposeAsync() { ... }
      - pattern-not-regex: '\bvoid[ \t]+(?:System\.)?IDisposable\.Dispose[ \t]*\([ \t]*\)\s*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\}'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.nonsensical-size-comparison
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove this comparison of a collection size or array length with a negative value, its result is always the same.
      Sizes and lengths are never negative.
    patterns:
      - pattern-either:
          - pattern: $X.$P >= 0
          - pattern: $X.$P < 0
          - pattern: 0 <= $X.$P
          - pattern: 0 > $X.$P
          - pattern: $X.$P() >= 0
          - pattern: $X.$P() < 0
      - metavariable-regex:
          metavariable: $P
          regex: '^(?:Count|Length|LongLength|LongCount)$'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.exception-created-not-thrown
    severity: ERROR
    languages:
      - csharp
    message: >-
      Throw this exception or remove its creation.
      Creating an exception without throwing it has no effect, the 'throw' keyword was probably forgotten.
    patterns:
      - pattern: new $E(...);
      - metavariable-regex:
          metavariable: $E
          regex: '.*Exception$'
      - pattern-not-inside: $V = $X;
      - pattern-not-inside: $TY $V = $X;
      - pattern-not-inside: var $V = $X;
      - pattern-not-inside: return $X;
      - pattern-not-inside: throw $X;
      - pattern-not-inside: $F(...);
      - pattern-not-inside: $O.$F(...);
      - pattern-not-regex: '=>\s*new\b[^;]*;'
    options:
      implicit_deep_exprstmt: false
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.lock-on-weak-identity-object
    severity: ERROR
    languages:
      - csharp
    message: >-
      Lock on a dedicated private object instead of an object with a weak identity.
      Objects such as strings, types, threads or some exceptions can be shared across application domains, which can cause deadlocks.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C { ... $T $F; ... }
          - pattern-inside: |
              class $C { ... $T $F = $I; ... }
      - metavariable-regex:
          metavariable: $T
          regex: '^(?:System\.)?(?:string|String|Type|Thread|MemberInfo|ParameterInfo|MethodInfo|FieldInfo|PropertyInfo|ConstructorInfo|ExecutionEngineException|OutOfMemoryException|StackOverflowException|MarshalByRefObject)$'
      - pattern-either:
          - pattern: lock ($F) { ... }
          - pattern: lock (this.$F) { ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.disposable-without-finalizer
    severity: ERROR
    languages:
      - csharp
    message: >-
      Add a finalizer to this disposable type that holds unmanaged handles.
      Without a finalizer, the unmanaged resource leaks when the object is not disposed explicitly.
    patterns:
      - pattern-regex: '\bclass[ \t]+\K\w+(?=[^{;]*:[^{;]*\bIDisposable\b)'
      - pattern-either:
          - pattern-inside: |
              class $C { ... IntPtr $F; ... }
          - pattern-inside: |
              class $C { ... UIntPtr $F; ... }
          - pattern-inside: |
              class $C { ... HandleRef $F; ... }
          - pattern-inside: |
              class $C { ... IntPtr $F = $V; ... }
      - pattern-not-regex: '\bclass[ \t]+(\w+)[\s\S]*?~\1[ \t]*\('
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.iequatable-class-not-sealed
    severity: ERROR
    languages:
      - csharp
    message: >-
      Seal this class, or make its Equals method virtual.
      Derived classes cannot change how equality is computed, which leads to inconsistent results when comparing instances of different types.
    patterns:
      - pattern-regex: '\bclass[ \t]+\K(\w+)(?=[^{;]*:[^{;]*\bIEquatable[ \t]*<[ \t]*\1[ \t]*>)'
      - pattern-not-inside: |
          sealed class $C { ... }
      - pattern-not-inside: |
          class $C { ... virtual bool Equals($T $O) { ... } ... }
      - pattern-not-inside: |
          class $C { ... virtual bool Equals($T $O) => $E; ... }
      - pattern-not-inside: |
          class $C { ... abstract bool Equals($T $O); ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.flags-enum-invalid-value
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use a power of two, or a combination of other members, for this [Flags] enumeration member.
      Values that are neither single bits nor combinations of other flags make bitwise operations unreliable.
    patterns:
      - pattern-regex: '(?:[{,])\s*(?://[^\n]*\s*)*(?<NAME>\w+)[ \t]*=[ \t]*(?<VAL>\d+)\b(?=[^{}]*\})'
      - pattern-regex: '\[[ \t]*(?:System\.)?Flags(?:Attribute)?[ \t]*\][^;{}]*?\benum\b[^{]*\{[^{}]*\}'
      - metavariable-comparison:
          comparison: int($VAL) > 0 and (int($VAL) & (int($VAL) - 1)) != 0
      - focus-metavariable: $NAME
    metadata:
      category: correctness
      confidence: LOW
  - id: codacy.csharp.correctness.collection-element-overwritten
    severity: WARNING
    languages:
      - csharp
    message: >-
      Verify this element replacement, the previous value is overwritten without being used.
      Assigning the same collection element twice in a row is usually a copy-paste mistake.
    patterns:
      - pattern-either:
          - pattern-inside: |
              $L[$I] = $A;
              $L[$I] = $B;
          - pattern-inside: |
              $L.Add($I, $A);
              $L[$I] = $B;
      - pattern: $L[$I] = $B;
      - pattern-not: $L[$I] = <... $L[$I] ...>;
    options:
      constant_propagation: false
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.empty-collection-accessed
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove this access to an empty collection, or add elements to it first.
      Reading, removing from or iterating over a collection that was just created empty is pointless and probably a bug.
    patterns:
      - pattern-either:
          - pattern-inside: |
              var $X = new $C();
              ...
          - pattern-inside: |
              $T $X = new $C();
              ...
      - metavariable-regex:
          metavariable: $C
          regex: '^(?:System\.Collections\.Generic\.)?(?:List|HashSet|Dictionary|Queue|Stack|SortedSet|SortedDictionary|SortedList|LinkedList)<.*>$'
      - pattern-either:
          - patterns:
              - pattern: $X.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: '^(?:Remove|RemoveAt|RemoveAll|Contains|ContainsKey|ContainsValue|IndexOf|Find|FindAll|Exists|Clear|Pop|Dequeue|Peek|First|Last|ElementAt)$'
          - pattern: foreach ($T2 $V in $X) $S;
          - pattern: foreach (var $V in $X) $S;
      - pattern-not-inside: |
          $R $METH(...) { ... $X.Add(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $X.AddRange(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $X.Insert(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $X.Push(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $X.Enqueue(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $X.TryAdd(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $X.UnionWith(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $X[$K] = $W; ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $F(..., $X, ...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $O.$F(..., $X, ...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $Y = $X; ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.export-without-implementation
    severity: ERROR
    languages:
      - csharp
    message: >-
      Implement the exported interface in this class, or change the type passed to the Export attribute.
      MEF fails at runtime when an exported part does not implement the contract type it exports.
    pattern-regex: '\[[ \t]*(?:Inherited)?Export[ \t]*\([ \t]*typeof[ \t]*\([ \t]*[\w.]+[ \t]*\)[^\]]*\]\s*(?:\[[^\]]*\]\s*)*(?:(?:public|internal|sealed|abstract|partial)[ \t]+)*class[ \t]+\K\w+(?=[ \t]*(?:<[^>]*>)?(?:\s*//[^\n]*)*\s*\{)'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.missing-stathread-on-windows-forms-main
    severity: ERROR
    languages:
      - csharp
    message: >-
      Add the [STAThread] attribute to this Windows Forms entry point.
      Windows Forms requires the single-threaded apartment model; without it, features such as the clipboard and dialogs fail.
    patterns:
      - pattern: |
          static void Main(...) { ... Application.Run(...); ... }
      - pattern-not: |
          [STAThread]
          static void Main(...) { ... }
      - pattern-not: |
          [System.STAThread]
          static void Main(...) { ... }
      - pattern-not: |
          [STAThreadAttribute]
          static void Main(...) { ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.invalid-event-arguments
    severity: ERROR
    languages:
      - csharp
    message: >-
      Pass a non-null sender and a non-null EventArgs instance when raising this event.
      Event handlers expect a valid sender for instance events and EventArgs.Empty when there is no data.
    patterns:
      - pattern-inside: |
          class $C { ... event $T $E; ... }
      - pattern-either:
          - pattern: $E?.Invoke($S, null)
          - pattern: $E.Invoke($S, null)
          - pattern: $E($S, null)
          - patterns:
              - pattern-either:
                  - pattern: $E?.Invoke(null, $A)
                  - pattern: $E.Invoke(null, $A)
                  - pattern: $E(null, $A)
              - pattern-not-inside: |
                  static $R $M(...) { ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.shared-part-instantiated
    severity: ERROR
    languages:
      - csharp
    message: >-
      Get this shared MEF part from the composition container instead of creating it with 'new'.
      Instantiating it directly creates a second instance, defeating the shared creation policy.
    patterns:
      - pattern: new $C(...)
      - pattern-inside: |
          [PartCreationPolicy(CreationPolicy.Shared)]
          class $C { ... }
          ...
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.part-creation-policy-without-export
    severity: WARNING
    languages:
      - csharp
    message: >-
      Add an Export attribute to this class, or remove its PartCreationPolicy attribute.
      The creation policy has no effect on classes that are not exported MEF parts.
    pattern-regex: '(?m)^(?<!\]\n)(?<!\]\r\n)[ \t]*(?=(?:\[[^\]]*\]\s*)*?\[[ \t]*PartCreationPolicy\b)(?!(?:\[[^\]]*\]\s*)*?\[[^\]]*\b(?:Inherited)?Export\b)(?:\[[^\]]*\]\s*)+(?:(?:public|internal|sealed|abstract|partial)[ \t]+)*class[ \t]+\K\w+'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.iterator-argument-validation
    severity: ERROR
    languages:
      - csharp
    message: >-
      Move this argument validation to a non-iterator method that calls the iterator.
      Code in an iterator method only runs when the result is enumerated, so invalid arguments are reported too late.
    patterns:
      - pattern: throw new $E(...);
      - metavariable-regex:
          metavariable: $E
          regex: '^(?:System\.)?Argument\w*Exception$'
      - pattern-inside: |
          $R $M(...) { ... yield return $X; ... }
      - pattern-not-inside: |
          ($P) => { ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.async-argument-validation
    severity: ERROR
    languages:
      - csharp
    message: >-
      Move this argument validation to a non-async method that calls the async implementation.
      Exceptions thrown in an async method are stored in the returned task, so callers only see them when they await it.
    patterns:
      - pattern: throw new $E(...);
      - metavariable-regex:
          metavariable: $E
          regex: '^(?:System\.)?Argument\w*Exception$'
      - pattern-inside: |
          async $R $M(...) { ... }
      - pattern-not-inside: |
          ($P) => { ... }
      - pattern-not-inside: |
          async ($P) => { ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.blocking-async-call
    severity: ERROR
    languages:
      - csharp
    message: >-
      Await this task instead of blocking on it.
      Blocking with .Result, .Wait() or GetAwaiter().GetResult() can deadlock when a synchronization context is present and wastes threads.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $O.$M(...).Result
              - pattern: $O.$M(...).Wait(...)
              - pattern: $M(...).Result
              - pattern: $M(...).Wait(...)
          - metavariable-regex:
              metavariable: $M
              regex: '.*Async$'
      - pattern: $X.GetAwaiter().GetResult()
      - pattern: Task.WaitAll(...)
      - pattern: Task.WaitAny(...)
      - pattern: (Task $T).Wait(...)
      - pattern: (Task<$R> $T).Result
      - pattern: (Task<$R> $T).Wait(...)
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.begininvoke-without-endinvoke
    severity: ERROR
    languages:
      - csharp
    message: >-
      Call EndInvoke for this BeginInvoke call, or pass a callback that calls it.
      Without EndInvoke, resources are leaked and exceptions thrown by the delegate are lost.
    patterns:
      - pattern: $D.BeginInvoke(..., null, $STATE)
      - pattern-inside: |
          $R $M(...) { ... }
      - pattern-not-inside: |
          $R $M(...) { ... $D.EndInvoke(...); ... }
      - pattern-not-inside: |
          $R $M(...) { ... $V = $D.EndInvoke(...); ... }
      - pattern-not-inside: |
          $R $M(...) { ... var $V = $D.EndInvoke(...); ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.null-returned-from-task-method
    severity: ERROR
    languages:
      - csharp
    message: >-
      Return Task.CompletedTask or Task.FromResult() instead of null from this method.
      Awaiting a null task throws a NullReferenceException.
    patterns:
      - pattern: return null;
      - pattern-either:
          - pattern-inside: |
              Task $M(...) { ... }
          - pattern-inside: |
              Task<$T> $M(...) { ... }
          - pattern-inside: |
              ValueTask<$T> $M(...) { ... }
      - pattern-not-inside: |
          async $R $M(...) { ... }
      - pattern-not-inside: |
          ($P) => { ... }
      - pattern-not-inside: |
          () => { ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.valuetask-consumed-incorrectly
    severity: ERROR
    languages:
      - csharp
    message: >-
      Await this ValueTask only once, and do not block on it before it has completed.
      A ValueTask may be backed by a pooled object that is reused after the first await.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  ValueTask<$T> $V = $E;
                  ...
              - pattern-inside: |
                  ValueTask $V = $E;
                  ...
          - pattern: await $V
          - pattern-regex: '\bawait[ \t]+(\w+)\b[\s\S]*?\K\bawait[ \t]+\1\b'
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  ValueTask<$T> $V = $E;
                  ...
          - pattern-either:
              - pattern: $V.Result
              - pattern: $V.GetAwaiter().GetResult()
          - pattern-not-inside: if (<... $V.IsCompleted ...>) $S;
          - pattern-not-inside: if (<... $V.IsCompletedSuccessfully ...>) $S;
          - pattern-not-inside: "$V.IsCompletedSuccessfully ? $A : $B"
          - pattern-not-inside: "$V.IsCompleted ? $A : $B"
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.invalid-regular-expression
    severity: ERROR
    languages:
      - csharp
    message: >-
      Correct the syntax of this regular expression.
      An invalid pattern throws an ArgumentException when the regular expression is created or used.
    patterns:
      - pattern-either:
          - pattern: new Regex("$P", ...)
          - pattern: Regex.IsMatch($I, "$P", ...)
          - pattern: Regex.Match($I, "$P", ...)
          - pattern: Regex.Matches($I, "$P", ...)
          - pattern: Regex.Replace($I, "$P", ...)
          - pattern: Regex.Split($I, "$P", ...)
      - metavariable-regex:
          metavariable: $P
          regex: '^(?!(?:[^()\[\]\\]|\\.|\[\^?\]?(?:[^\]\\]|\\.)*\]|\((?:[^()\[\]\\]|\\.|\[\^?\]?(?:[^\]\\]|\\.)*\]|\((?:[^()\[\]\\]|\\.|\[\^?\]?(?:[^\]\\]|\\.)*\]|\((?:[^()\[\]\\]|\\.|\[\^?\]?(?:[^\]\\]|\\.)*\])*\))*\))*\))*$)|^[*+?]'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.lock-on-local-variable
    severity: ERROR
    languages:
      - csharp
    message: >-
      Lock on a field shared by all threads instead of this local variable.
      Each call creates its own local object, so the lock does not synchronize anything.
    patterns:
      - pattern-either:
          - pattern-inside: |
              $R $M(...) { ... $T $X = $E; ... }
          - pattern-inside: |
              $R $M(...) { ... var $X = $E; ... }
      - pattern: lock ($X) { ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.datetime-without-kind
    severity: ERROR
    languages:
      - csharp
    message: >-
      Provide the DateTimeKind when creating this DateTime.
      Without it, the kind is Unspecified and conversions between local time and UTC become ambiguous.
    patterns:
      - pattern-either:
          - pattern: new DateTime($Y, $M, $D)
          - pattern: new DateTime($Y, $M, $D, $H, $MI, $S)
          - pattern: new DateTime($Y, $M, $D, $H, $MI, $S, $MS)
          - pattern: new DateTime($TICKS)
          - pattern: new System.DateTime($Y, $M, $D)
          - pattern: new System.DateTime($Y, $M, $D, $H, $MI, $S)
      - pattern-not: new DateTime($Y, $M, $D, $H, $MI, $S, DateTimeKind.$K)
      - pattern-not: new DateTime($Y, $M, $D, $H, $MI, $S, System.DateTimeKind.$K)
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.date-parse-without-format-provider
    severity: ERROR
    languages:
      - csharp
    message: >-
      Pass an IFormatProvider, such as CultureInfo.InvariantCulture, when parsing this date or time.
      Without it, the parsing depends on the culture of the machine and can give different results or fail.
    patterns:
      - pattern-either:
          - pattern: $T.Parse($S)
          - pattern: $T.TryParse($S, $R)
          - pattern: $T.ParseExact($S, $F, null)
          - pattern: $T.ParseExact($S, $F, null, $ST)
          - pattern: $T.TryParseExact($S, $F, null, $ST, $R)
      - metavariable-regex:
          metavariable: $T
          regex: '^(?:System\.)?(?:DateTime|DateTimeOffset|TimeSpan|DateOnly|TimeOnly)$'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.logging-arguments-in-message-arguments
    severity: ERROR
    languages:
      - csharp
    message: >-
      Pass this exception as the dedicated exception parameter of the logging call instead of as a message argument.
      Exceptions passed as message arguments lose their stack trace and are not handled by logging providers.
    patterns:
      - pattern-either:
          - pattern-inside: |
              try { ... } catch ($T $E) { ... }
          - pattern-inside: |
              try { ... } catch ($T $E) { ... } finally { ... }
      - pattern: $L.$LOG("$MSG", ..., $E, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: '^Log(?:Trace|Debug|Information|Warning|Error|Critical)?$'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.log-template-argument-order
    severity: ERROR
    languages:
      - csharp
    message: >-
      Reorder the arguments of this logging call to match the order of the placeholders in the message template.
      Placeholders are filled by position, so swapped arguments produce misleading log entries.
    pattern-regex: '\.(?:Log(?:Trace|Debug|Information|Warning|Error|Critical)?|Verbose|Debug|Information|Warning|Error|Fatal)[ \t]*\(\s*(?:[^"(),]+,\s*)*\K"[^"]*\{(\w+)(?:[,:][^}]*)?\}[^"]*\{(\w+)(?:[,:][^}]*)?\}[^"]*"\s*,\s*(?:[\w.]*\.)?(?i:\2)\s*,\s*(?:[\w.]*\.)?(?i:\1)\s*\)'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.invalid-log-message-template
    severity: ERROR
    languages:
      - csharp
    message: >-
      Correct the syntax of this log message template.
      Placeholder names may only contain letters, digits and underscores, optionally followed by an alignment and a format.
    patterns:
      - pattern-either:
          - pattern: $L.$LOG("$T", ...)
          - pattern: $L.$LOG($X, "$T", ...)
          - pattern: $L.$LOG($X, $Y, "$T", ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: '^(?:Log(?:Trace|Debug|Information|Warning|Error|Critical)?|BeginScope|Verbose|Debug|Information|Warning|Error|Fatal)$'
      - metavariable-regex:
          metavariable: $T
          regex: '(?s).*(?<!\{)\{(?!\{)(?![@$]?\w+(?:,-?\d+)?(?::[^{}]+)?\})'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.jsinvokable-method-not-public
    severity: ERROR
    languages:
      - csharp
    message: >-
      Make this [JSInvokable] method public.
      JavaScript interop can only invoke public methods, so the call fails at runtime.
    patterns:
      - pattern: |
          [JSInvokable]
          $R $M(...) { ... }
      - pattern-not: |
          [JSInvokable]
          public $R $M(...) { ... }
      - focus-metavariable: $M
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.best-practice.test-class-without-tests
    severity: WARNING
    languages:
      - csharp
    message: >-
      Add at least one test method to this test class.
      A test class without tests gives the false impression that the tested code is covered.
    pattern-either:
      - patterns:
          - pattern: |
              [TestClass]
              class $C { ... }
          - pattern-not: |
              [TestClass]
              class $C { ... [TestMethod] $R $M(...) { ... } ... }
          - pattern-not: |
              [TestClass]
              class $C { ... [DataTestMethod] $R $M(...) { ... } ... }
          - pattern-not: |
              [TestClass]
              class $C { ... [AssemblyInitialize] $R $M(...) { ... } ... }
          - pattern-not: |
              [TestClass]
              class $C { ... [AssemblyCleanup] $R $M(...) { ... } ... }
          - pattern-not: |
              [TestClass]
              abstract class $C { ... }
          - pattern-not: |
              [TestClass]
              class $C : $B { ... }
          - focus-metavariable: $C
      - patterns:
          - pattern: |
              [TestFixture]
              class $C { ... }
          - pattern-not: |
              [TestFixture]
              class $C { ... [Test] $R $M(...) { ... } ... }
          - pattern-not: |
              [TestFixture]
              class $C { ... [TestCase(...)] $R $M(...) { ... } ... }
          - pattern-not: |
              [TestFixture]
              class $C { ... [TestCaseSource(...)] $R $M(...) { ... } ... }
          - pattern-not: |
              [TestFixture]
              class $C { ... [Theory] $R $M(...) { ... } ... }
          - pattern-not: |
              [TestFixture]
              abstract class $C { ... }
          - pattern-not: |
              [TestFixture]
              class $C : $B { ... }
          - focus-metavariable: $C
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.test-without-assertion
    severity: ERROR
    languages:
      - csharp
    message: >-
      Add at least one assertion to this test method.
      A test without assertions only checks that no exception is thrown and gives a false sense of security.
    pattern-regex: '\[[ \t]*(?:TestMethod|DataTestMethod|Test|TestCase|Fact|Theory)\b[^\]]*\]\s*(?:\[[^\]]*\]\s*)*(?:(?:public|private|protected|internal|async|static|virtual|override)[ \t]+)*[\w.<>]+[ \t]+\K\w+(?=[ \t]*\([^)]*\)(?:\s*//[^\n]*)*\s*\{(?:(?!\b(?:Assert\w*|Should\w*|Verify\w*|Received\w*|Expect\w*|Check|Throws\w*|Fail|Must\w*)\b)[^{}]|\{(?:(?!\b(?:Assert\w*|Should\w*|Verify\w*|Received\w*|Expect\w*|Check|Throws\w*|Fail|Must\w*)\b)[^{}]|\{(?:(?!\b(?:Assert\w*|Should\w*|Verify\w*|Received\w*|Expect\w*|Check|Throws\w*|Fail|Must\w*)\b)[^{}]|\{(?:(?!\b(?:Assert\w*|Should\w*|Verify\w*|Received\w*|Expect\w*|Check|Throws\w*|Fail|Must\w*)\b)[^{}])*\})*\})*\})*\})'
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.correctness.incomplete-assertion
    severity: ERROR
    languages:
      - csharp
    message: >-
      Complete this assertion, it does not verify anything yet.
      Calls such as 'actual.Should()' or 'Check.That(actual)' only start an assertion chain.
    patterns:
      - pattern-either:
          - pattern: $X.Should();
          - pattern: Check.That($X);
          - pattern: Check.ThatCode($X);
          - pattern: $S.Received();
          - pattern: $S.Received($N);
          - pattern: $S.DidNotReceive();
          - pattern: $S.ReceivedWithAnyArgs();
      - pattern-not-inside: $V = $E;
      - pattern-not-inside: var $V = $E;
      - pattern-not-inside: return $E;
    options:
      implicit_deep_exprstmt: false
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.security.console-output-logging
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use a dedicated logging framework instead of writing to the console.
      Console output cannot be filtered, routed or secured, and may disclose sensitive information.
    patterns:
      - pattern-either:
          - pattern: Console.Write(...)
          - pattern: Console.WriteLine(...)
          - pattern: Console.Out.$M(...)
          - pattern: Console.Error.$M(...)
          - pattern: System.Console.Write(...)
          - pattern: System.Console.WriteLine(...)
      - pattern-not-regex: '(?s)#if[ \t]+DEBUG\b.*?#endif'
      - pattern-not-regex: '\[[ \t]*Conditional[ \t]*\([ \t]*"DEBUG"[ \t]*\)[ \t]*\][^{]*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      confidence: LOW
  - id: codacy.csharp.best-practice.hardcoded-uri
    severity: WARNING
    languages:
      - csharp
    message: >-
      Do not hardcode this URI or absolute path, read it from configuration instead.
      Hardcoded locations break when the application is deployed to another environment.
    patterns:
      - pattern: '"$S"'
      - metavariable-regex:
          metavariable: $S
          regex: '^(?:[a-zA-Z][\w+.-]*://[^\s/]+\S*|[a-zA-Z]:\\{1,2}\S+|\\{2,4}\w\S+|/(?:[\w.-]+/)+[\w.-]+)$'
      - metavariable-regex:
          metavariable: $S
          regex: '^(?!https?://(?:www\.)?(?:w3\.org|schemas\.|purl\.org|xmlns\.))'
      - pattern-not-regex: '(?m)^[ \t]*\[[^\n]*\][ \t]*(?://[^\n]*)?$'
    options:
      constant_propagation: false
    metadata:
      category: best-practice
      confidence: LOW
  - id: codacy.csharp.codestyle.empty-nested-block
    severity: INFO
    languages:
      - csharp
    message: >-
      Fill this empty block, or remove it.
      An empty block without a comment makes it unclear whether code is missing or the block is empty on purpose.
    pattern-either:
      - pattern-regex: '\b\K(?:if|while|for|foreach|lock|using|switch|fixed)[ \t]*\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\)\s*\{\s*\}'
      - pattern-regex: '\b\K(?:else|try|finally|do)\s*\{\s*\}'
      - pattern-regex: '\b\Kcatch\b(?:[ \t]*\([^()]*\))?(?:\s*when\s*\((?:[^()]|\([^()]*\))*\))?\s*\{\s*\}'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.magic-number
    severity: INFO
    languages:
      - csharp
    message: >-
      Replace this magic number with a named constant.
      Unnamed numeric literals hide their meaning and must be changed in many places when their value changes.
    patterns:
      - pattern: $N
      - metavariable-regex:
          metavariable: $N
          regex: '^(?!(?:0+|1)(?:\.0+)?[uUlLfFdDmM]{0,2}$)(?:\d[\d_]*(?:\.\d+)?|0[xX][\da-fA-F_]+|0[bB][01_]+)[uUlLfFdDmM]{0,2}$'
      - pattern-not-inside: $T $V = $E;
      - pattern-not-inside: var $V = $E;
      - pattern-not-inside: const $T $V = $E;
      - pattern-not-inside: new $T(...)
      - pattern-not-inside: |
          override int GetHashCode() { ... }
      - pattern-not-inside: |
          enum $EN { ... }
      - pattern-not-regex: '(?m)^[ \t]*\[[^\n]*\][ \t]*(?://[^\n]*)?$'
      - pattern-not-regex: '\b\w+[ \t]*:[ \t]*-?[\d.]+\w*(?=[ \t]*[,)])'
      - pattern-not-regex: '(?<![=!<>])=(?!=)[ \t]*-?\d[\w.]*(?=[ \t]*[,)])'
    metadata:
      category: codestyle
      confidence: LOW
  - id: codacy.csharp.best-practice.public-field
    severity: WARNING
    languages:
      - csharp
    message: >-
      Make this field private and encapsulate it in a property.
      Public fields expose the internal representation of a class and cannot be validated or changed later without breaking callers.
    patterns:
      - pattern-either:
          - pattern: |
              class $C { ... public $T $F; ... }
          - pattern: |
              class $C { ... public $T $F = $V; ... }
      - pattern-not: |
          class $C { ... public readonly $T $F; ... }
      - pattern-not: |
          class $C { ... public readonly $T $F = $V; ... }
      - pattern-not: |
          class $C { ... public const $T $F = $V; ... }
      - pattern-not: |
          class $C { ... public static readonly $T $F = $V; ... }
      - pattern-not: |
          [StructLayout(...)]
          class $C { ... }
      - pattern-not: |
          [Serializable]
          class $C { ... }
      - pattern-not: |
          class $C { ... public event $T $F; ... }
      - focus-metavariable: $F
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.obsolete-without-explanation
    severity: INFO
    languages:
      - csharp
    message: >-
