  - id: codacy.csharp.correctness.modulus-equality-check
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not compare the result of this modulus operation with a non-zero value.
      The remainder of a negative number is negative, so a check such as 'x % 2 == 1' fails for negative odd numbers.
