  - id: codacy.csharp.correctness.indexof-positive-check
    severity: ERROR
    languages:
      - csharp
    message: >-
      Check whether this IndexOf result is '>= 0' instead of '> 0'.
      Index 0 is a valid position, so '> 0' misses matches at the first position.
    pattern-either:
      - pattern: $X.IndexOf(...) > 0
      - pattern: 0 < $X.IndexOf(...)
      - pattern: $X.IndexOfAny(...) > 0
      - pattern: 0 < $X.IndexOfAny(...)
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.static-field-written-from-instance
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not write this static field from an instance member.
      Updating shared static state from instance methods is error-prone and not thread-safe.
