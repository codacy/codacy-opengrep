    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.gethashcode-uses-mutable-field
    severity: ERROR
    languages:
      - csharp
    message: >-
      Refactor GetHashCode() to not use this mutable field.
      If the field changes while the object is stored in a hash-based collection, the object can no longer be found.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C { ... $T $F; ... }
          - pattern-inside: |
              class $C { ... $T $F = $I; ... }
      - pattern-not-inside: |
          class $C { ... readonly $T2 $F; ... }
      - pattern-not-inside: |
          class $C { ... readonly $T2 $F = $I2; ... }
      - pattern-not-inside: |
          class $C { ... const $T2 $F = $I2; ... }
      - pattern-either:
          - pattern-inside: |
              override int GetHashCode() { ... }
          - pattern-inside: |
              override int GetHashCode() => $E;
      - pattern-either:
          - pattern: $F
          - pattern: this.$F
