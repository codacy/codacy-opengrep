  - id: codacy.csharp.correctness.reference-equals-value-type
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use Equals() or '==' instead of ReferenceEquals() to compare these value types.
      Value types are boxed into new objects, so ReferenceEquals always returns false.
    patterns:
      - pattern-either:
          - pattern: ReferenceEquals($A, $B)
          - pattern: object.ReferenceEquals($A, $B)
          - pattern: Object.ReferenceEquals($A, $B)
      - metavariable-type:
          metavariable: $A
          types: [int, long, short, byte, double, float, decimal, bool, char, DateTime, TimeSpan, Guid, DateTimeOffset]
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.threadstatic-field-initialized
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not initialize this [ThreadStatic] field inline, initialize it lazily instead.
