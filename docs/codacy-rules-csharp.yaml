      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.same-condition-tested-twice
    severity: WARNING
    languages:
      - csharp
    message: >-
      Merge this if statement with the previous one, it tests the same condition.
      Testing the same condition twice in a row is confusing and is often a mistake.
    patterns:
      - pattern-inside: |
          if ($C) $A;
          if ($C) $B;
      - pattern: if ($C) $B;
      - pattern-not-inside: |
          if ($C) { ... $X = $V; ... }
          if ($C) $B;
      - pattern-not-inside: |
          if ($C) $A; else $E;
          if ($C) $B;
      - pattern-not-inside: |
          if ($C) $B;
          if ($C) $Z;
