      - pattern-either:
          - pattern-inside: |
              class $C { ... static $T $F; ... }
          - pattern-inside: |
              class $C { ... static $T $F = $I; ... }
          - pattern-inside: |
              interface $C { ... static $T $F = $I; ... }
      - pattern-inside: |
          $R $M(...) { ... }
      - pattern-not-inside: |
          static $R $M(...) { ... }
      - pattern-either:
          - pattern: $F = $V
          - pattern: $F += $V
          - pattern: $F -= $V
          - pattern: $F++
          - pattern: $F--
          - pattern: ++$F
          - pattern: --$F
