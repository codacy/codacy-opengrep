    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.lock-on-non-readonly-field
    severity: ERROR
    languages:
      - csharp
    message: >-
      Lock on a dedicated private readonly object instead.
      If the locked field is reassigned, different threads can lock on different objects and the critical section is no longer protected.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $C { ... $T $F; ... }
              - pattern-inside: |
                  class $C { ... $T $F = $I; ... }
          - pattern-not-inside: |
              class $C { ... readonly $T2 $F; ... }
          - pattern-not-inside: |
              class $C { ... readonly $T2 $F = $I2; ... }
          - pattern-either:
              - pattern: lock ($F) { ... }
              - pattern: lock (this.$F) { ... }
      - pattern: lock (new $T(...)) { ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.lock-on-shared-resource
    severity: ERROR
    languages:
      - csharp
    message: >-
