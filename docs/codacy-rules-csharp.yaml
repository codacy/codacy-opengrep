              - pattern-inside: |
                  $R $M(..., $T $X, ...) { ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.non-short-circuit-logic
    severity: ERROR
    languages:
      - csharp
    message: >-
