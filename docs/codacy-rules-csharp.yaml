    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.static-field-assigned-in-constructor
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not update this static field from an instance constructor.
      Every new instance overwrites the value shared by all instances.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C { ... static $T $F; ... }
          - pattern-inside: |
              class $C { ... static $T $F = $I; ... }
      - pattern-either:
          - pattern: $F = $V
          - pattern: $F += $V
          - pattern: $F -= $V
          - pattern: $F++
          - pattern: ++$F
      - pattern-regex: '(?m)^[ \t]*(?:(?:public|protected|internal|private)[ \t]+)*(?!(?:if|while|for|foreach|switch|catch|using|lock|fixed|return|new|else|static)\b)[A-Z]\w*[ \t]*\((?:[^()]|\([^()]*\))*\)\s*(?::\s*(?:base|this)\s*\((?:[^()]|\([^()]*\))*\)\s*)?\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.async-void-method
    severity: ERROR
    languages:
      - csharp
    message: >-
      Return a Task instead of void from this async method.
