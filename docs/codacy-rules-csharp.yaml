      constant_propagation: false
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.doubled-prefix-operator
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove the doubled '!' or '~' operator.
      Applying the same prefix operator twice cancels it out and is usually a typo.
    pattern-either:
      - pattern: "!!$X"
      - pattern: ~~$X
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.sql-keyword-without-whitespace
    severity: WARNING
    languages:
