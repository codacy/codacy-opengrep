      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.class-with-only-private-constructors
    severity: WARNING
    languages:
      - csharp
    message: >-
      Add a non-private constructor or a static factory to this class, or remove it.
      A class whose constructors are all private can never be instantiated.
