      constant_propagation: false
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.object-created-and-dropped
    severity: ERROR
    languages:
      - csharp
    message: >-
      Either remove this useless object instantiation or use the created object.
      Creating an object without using it is wasteful and often hides a missing assignment or a missing 'throw'.
    patterns:
      - pattern: new $T(...);
      - pattern-not-inside: $V = $E;
      - pattern-not-inside: $TY $V = $E;
      - pattern-not-inside: var $V = $E;
      - pattern-not-inside: return $E;
      - pattern-not-inside: throw $E;
      - pattern-not-inside: $F(...);
      - pattern-not-inside: $O.$F(...);
      - pattern-not-regex: '=>\s*new\b[^;]*;'
      - pattern-not-inside: ($P) => $E
      - pattern-not-inside: $P => $E
      - pattern-not-inside: () => $E
    options:
      implicit_deep_exprstmt: false
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.performance.dead-store
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove this useless assignment, the value is overwritten before it is read.
      Dead stores waste computation and often indicate a logic error.
    patterns:
      - pattern-either:
          - pattern: |
              $T $X = $A;
              $X = $B;
          - patterns:
              - pattern: |
                  $X = $A;
                  $X = $B;
              - pattern-either:
                  - pattern-inside: |
                      $T $X;
                      ...
                  - pattern-inside: |
                      $T $X = $I;
                      ...
      - pattern-not: |
          $T $X = $A;
          $X = <... $X ...>;
      - pattern-not: |
          $X = $A;
          $X = <... $X ...>;
      - metavariable-regex:
          metavariable: $A
          regex: '^(?!(?:-1|0|1|null|true|false|""|string\.Empty|String\.Empty|default)$)'
      - focus-metavariable: $A
    metadata:
      category: performance
      confidence: MEDIUM
  - id: codacy.csharp.correctness.duplicate-condition-in-if-chain
    severity: ERROR
    languages:
      - csharp
    message: >-
      Change this condition, it duplicates an earlier condition of the same if-else-if chain.
      The branch guarded by a duplicated condition can never execute.
    patterns:
      - pattern-inside: if ($C) $A; else $REST;
      - pattern: if ($C) $B;
      - pattern-not: if ($C) $A; else $REST;
