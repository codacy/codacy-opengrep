      - pattern-not: |
          class $C : $B, IDisposable, $I { ... }
      - pattern-not: |
          class $C : $B, $I, IDisposable { ... }
      - pattern-not: |
          class $C : IAsyncDisposable { ... }
      - pattern-not: |
          class $C : $B, IAsyncDisposable { ... }
      - pattern-not: |
          class $C : IDisposable, IAsyncDisposable { ... }
      - focus-metavariable: $C
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.dispose-does-not-dispose-fields
    severity: ERROR
    languages:
      - csharp
    message: >-
      Dispose this field in the Dispose method of its class.
      A disposable class must release the disposable members it creates when it is disposed.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C { ... $T $F = new $D(...); ... }
          - pattern-inside: |
              class $C { ... $R $M(...) { ... $F = new $D(...); ... } ... }
          - pattern-inside: |
              class $C { ... $C(...) { ... $F = new $D(...); ... } ... }
      - metavariable-regex:
          metavariable: $D
          regex: '^(?:System\.IO\.)?(?:FileStream|StreamReader|StreamWriter|BinaryReader|BinaryWriter|Bitmap|WebClient|TcpClient|UdpClient|Socket|CancellationTokenSource|SqlConnection|SqlCommand|Mutex|Semaphore|SemaphoreSlim|Timer|MemoryStream)$'
