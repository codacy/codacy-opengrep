      - pattern-either:
          - pattern: $X % $N == $K
          - pattern: $X % $N != $K
          - pattern: $K == $X % $N
          - pattern: $K != $X % $N
      - metavariable-regex:
          metavariable: $K
          regex: '^-?[1-9]\d*$'
      - metavariable-regex:
          metavariable: $X
          regex: '^(?!.*\.(?:Count|Length|LongLength)$)(?!.*\.Count\(\)$)'
      - pattern-not: (uint $X) % $N == $K
      - pattern-not: (ulong $X) % $N == $K
      - pattern-not: (byte $X) % $N == $K
      - pattern-not: (ushort $X) % $N == $K
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.always-same-math-comparison
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove this comparison, its result is always the same.
      The value is compared with a constant outside of the range of its type.
