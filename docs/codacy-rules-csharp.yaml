    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.disposed-object-returned
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not return this object, it is disposed at the end of the using statement.
      The caller receives an object that can no longer be used.
