                - pattern-not: <... $I ...>
          - metavariable-pattern:
              metavariable: $C
              pattern: <... $I ...>
      - patterns:
          - pattern: for ($I = $X; $C; $U) $B
          - metavariable-pattern:
              metavariable: $U
              patterns:
                - pattern-not: <... $I ...>
          - metavariable-pattern:
              metavariable: $C
              pattern: <... $I ...>
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.correctness.collection-passed-to-own-method
    severity: WARNING
    languages:
      - csharp
    message: >-
      Do not pass a collection to one of its own methods.
      Calls such as list.AddRange(list) or set.UnionWith(set) are either useless or produce unexpected results.
