rules:
  - id: codacy.csharp.codestyle.method-property-pascal-case
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this method or property to match the PascalCase naming convention.
      Shared naming conventions make code easier to read; names containing '_' are
      ignored, but leading or trailing underscores are reported.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  $R $NAME(...) { ... }
              - pattern: |
                  $R $NAME(...) => $X;
          - pattern-not: |
              override $R $NAME(...) { ... }
          - pattern-not: |
              override $R $NAME(...) => $X;
          - focus-metavariable: $NAME
          - metavariable-regex:
              metavariable: $NAME
              regex: '^(?!(?:get|set|init|add|remove)$)(?:_\w*|\w*_|(?!\w*_)(?:[a-z]\w*|\w*[A-Z]{3}\w*|[A-Z]{2}))$'
      - pattern-regex: '(?m)^[ \t]*(?:(?:public|private|protected|internal|static|virtual|abstract|sealed|new|required|readonly|unsafe|extern)\s+)*(?!override\b|return\b|var\b|await\b)[\w.]+(?:<[^\n;=()]*>)?(?:\[[, ]*\])?\??\s+\K(?:_\w*|\w*_|(?!\w*_)(?:[a-z]\w*|\w*[A-Z]{3}\w*|[A-Z]{2}))(?=\s*(?:\{\s*(?:get|set|init|private|protected|internal)\b|=>))'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.type-pascal-case
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this type to match the PascalCase naming convention.
      Type names should start with an upper case letter, should not contain '_' and
      should not contain more than two consecutive upper case letters.
    patterns:
      - pattern-either:
          - pattern: |
              class $NAME { ... }
          - pattern: |
              struct $NAME { ... }
          - pattern: |
              interface $NAME { ... }
          - pattern: |
              enum $NAME { ... }
          - pattern: |
              record $NAME(...);
          - pattern: |
              record $NAME { ... }
      - focus-metavariable: $NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?:I(?=[A-Z][a-z0-9]))?(?:\w*_\w*|[a-z]\w*|\w*[A-Z]{3}\w*|[A-Z]{2})$'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.line-too-long
    severity: INFO
    languages:
      - csharp
    message: >-
      Split this line, it is longer than 200 characters.
      Long lines are hard to read and to review side by side.
    pattern-regex: '(?m)^[^\n]{201,}$'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.complexity.file-too-many-lines
    severity: WARNING
    languages:
      - csharp
    message: >-
      Split this file, it has more than 1000 non-blank lines.
      Large files tend to aggregate too many responsibilities and become hard to understand and maintain.
    pattern-regex: '\A(?:[ \t\r]*\n)*(?:[^\n]*\S[^\n]*\n(?:[ \t\r]*\n)*){1000}[^\n]*\S'
    metadata:
      category: complexity
      confidence: HIGH
  - id: codacy.csharp.codestyle.tab-characters
    severity: INFO
    languages:
      - csharp
    message: >-
      Replace all tab characters in this file by sequences of white-spaces.
      Tab width differs between editors and tools, so mixing tabs and spaces breaks the code layout.
    pattern-regex: '\A[^\t]*\K\t'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.complexity.too-many-parameters
    severity: WARNING
    languages:
      - csharp
    message: >-
      Reduce the number of parameters of this method, it has more than 7.
      Long parameter lists are hard to use correctly; group related parameters into a type.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  $R $M($P1, $P2, $P3, $P4, $P5, $P6, $P7, $P8, ...) { ... }
              - pattern: |
                  $R $M($P1, $P2, $P3, $P4, $P5, $P6, $P7, $P8, ...) => $X;
              - pattern: |
                  $R $M($P1, $P2, $P3, $P4, $P5, $P6, $P7, $P8, ...);
          - focus-metavariable: $M
      - patterns:
          - pattern: |
              class $C { ... $C($P1, $P2, $P3, $P4, $P5, $P6, $P7, $P8, ...) { ... } ... }
          - pattern-not: |
              class $C { ... $C($P1, $P2, $P3, $P4, $P5, $P6, $P7, $P8, ...) : base(...) { ... } ... }
          - focus-metavariable: $P1
    metadata:
      category: complexity
      confidence: HIGH
  - id: codacy.csharp.codestyle.mergeable-if-statements
    severity: INFO
    languages:
      - csharp
    message: >-
      Merge this if statement with the enclosing one.
      Nested if statements without else branches can be combined with '&&' to reduce nesting.
    patterns:
      - pattern-either:
          - pattern: |
              if ($A) { if ($B) $S; }
          - pattern: |
              if ($A) if ($B) $S;
      - pattern-not: |
          if ($A) $X; else $Y;
      - pattern-not: |
          if ($A) { if ($B) $S; else $T; }
      - pattern-not: |
          if ($A) if ($B) $S; else $T;
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.close-brace-at-line-start
    severity: INFO
    languages:
      - csharp
    message: >-
      Move this closing curly brace to the beginning of a new line.
      Closing braces placed after code on the same line make the block structure hard to see.
    pattern-regex: '(?m)^(?![ \t]*(?://|/?\*))[^{}\n"]*[^\s{}][ \t]*\K\}'
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.empty-statement
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this empty statement.
      A stray semicolon does nothing and may hide a mistake, such as a loop or if statement with no body.
    pattern-either:
      - pattern-regex: '(?m)^(?![^\n]*\bfor\s*\()(?![ \t]*(?://|/?\*))[^\n]*?;[ \t]*\K;'
      - pattern-regex: '(?m)^[ \t]*\K;[ \t]*(?://[^\n]*)?$'
      - pattern-regex: '(?m)^[ \t]*(?:if|for|foreach)[ \t]*\((?:[^()\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\))*\)[ \t]*\K;[ \t]*(?://[^\n]*)?$'
      - pattern: while ($C);
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.local-shadows-field
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this local variable, it hides a field or property with the same name.
      Shadowing a member makes it unclear which one is read or written.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C { ... $T $F; ... }
          - pattern-inside: |
              class $C { ... $T $F = $I; ... }
          - pattern-inside: |
              class $C { ... $T $F { get; set; } ... }
          - pattern-inside: |
              class $C { ... $T $F { get; } ... }
      - pattern-inside: |
          $R $M(...) { ... }
      - pattern-not-inside: |
          static $R $M(...) { ... }
      - pattern-either:
          - pattern: $T2 $G = $V;
          - pattern: $T2 $G;
      - metavariable-comparison:
          comparison: str($F) == str($G)
      - focus-metavariable: $G
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.general-exception-thrown
    severity: ERROR
    languages:
      - csharp
    message: >-
      Throw a more specific exception type instead of a general or reserved one.
      General exceptions such as Exception or ApplicationException cannot be handled selectively,
      and reserved exceptions such as NullReferenceException are meant to be thrown by the runtime only.
    patterns:
      - pattern-either:
          - pattern: throw new $E(...);
          - pattern: throw new $E(...) { ... };
          - pattern: $X ?? throw new $E(...)
      - focus-metavariable: $E
      - metavariable-regex:
          metavariable: $E
          regex: '^(?:System\.)?(?:Exception|SystemException|ApplicationException|IndexOutOfRangeException|NullReferenceException|OutOfMemoryException|ExecutionEngineException)$'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.codestyle.assignment-in-sub-expression
    severity: INFO
    languages:
      - csharp
    message: >-
      Extract this assignment from the expression it is nested in.
      Assignments hidden inside other expressions are easy to overlook and hurt readability.
    patterns:
      - pattern-either:
          - pattern: $F(..., $X = $Y, ...)
          - pattern: $O.$F(..., $X = $Y, ...)
          - pattern: return $X = $Y;
          - patterns:
              - pattern-either:
                  - pattern: ($X = $Y) == $Z
                  - pattern: ($X = $Y) != $Z
                  - pattern: ($X = $Y) > $Z
                  - pattern: ($X = $Y) < $Z
                  - pattern: ($X = $Y) >= $Z
                  - pattern: ($X = $Y) <= $Z
                  - pattern: $Z && ($X = $Y)
                  - pattern: ($X = $Y) && $Z
                  - pattern: $Z || ($X = $Y)
                  - pattern: ($X = $Y) || $Z
              - pattern-not-inside: if ($C) $S;
              - pattern-not-inside: while ($C) $S;
              - pattern-not-inside: |
                  do $S; while ($C);
      - pattern-not-inside: |
          ($P) => { ... }
      - pattern-not-inside: |
          $P => { ... }
      - pattern-not-inside: |
          ($P) => $E
      - pattern-not-inside: |
          $P => $E
      - pattern-not-inside: |
          () => $E
      - pattern-not-inside: |
          () => { ... }
      - pattern-not-inside: |
          delegate (...) { ... }
      - pattern-not-inside: $A ?? ($X = $Y)
      - pattern-not-inside: new $T(...) { ... }
      - pattern-not-inside: new { ... }
      - pattern-not-regex: '(?m)^[ \t]*(?:for|foreach)\s*\([^\n]*$'
      - pattern-not-regex: '(?m)^[ \t]*\[[^\n]*\][ \t]*$'
    metadata:
      category: codestyle
      confidence: LOW
  - id: codacy.csharp.codestyle.redundant-boolean-literal
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this redundant boolean literal.
      Comparing a boolean expression to true or false, or combining it with a literal, only adds noise.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $X == true
              - pattern: $X == false
              - pattern: true == $X
              - pattern: false == $X
              - pattern: $X != true
              - pattern: $X != false
              - pattern: true != $X
              - pattern: false != $X
          - pattern-not: (bool? $X) == $L
          - pattern-not: (bool? $X) != $L
          - pattern-not: $L == (bool? $X)
          - pattern-not: $L != (bool? $X)
      - pattern: $X || false
      - pattern: $X || true
      - pattern: false || $X
      - pattern: true || $X
      - pattern: $X && true
      - pattern: $X && false
      - pattern: true && $X
      - pattern: false && $X
      - pattern: "!true"
      - pattern: "!false"
      - pattern: "$C ? true : $E"
      - pattern: "$C ? false : $E"
      - pattern: "$C ? $E : true"
      - pattern: "$C ? $E : false"
      - pattern-regex: '\bfor\s*\([^;\n]*;\s*\Ktrue(?=\s*;)'
    options:
      constant_propagation: false
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.missing-final-newline
    severity: INFO
    languages:
      - csharp
    message: >-
      Add a new line at the end of this file.
      Some tools and version control systems handle files without a trailing new line poorly.
    pattern-regex: '[^\n]\z'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.missing-curly-braces
    severity: INFO
    languages:
      - csharp
    message: >-
      Add curly braces around the body of this control structure.
      Bodies without braces make it easy to add a statement that looks conditional but is not.
    pattern-either:
      - patterns:
          - pattern: while ($C) $S;
          - pattern-not: while ($C) { ... }
      - patterns:
          - pattern: do $S; while ($C);
          - pattern-not: do { ... } while ($C);
      - pattern-regex: '(?m)^[ \t]*(?:else[ \t]+)?\K(?:if|foreach|for)[ \t]*\((?:[^()\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\))*\)(?>[ \t]*(?://[^\n]*)?)(?>(?:\r?\n[ \t]*)?)(?=[^\s{;/])'
      - pattern-regex: '(?m)\belse\b(?>[ \t]*(?://[^\n]*)?)(?>(?:\r?\n[ \t]*)?)\K(?!if\b)[^\s{/]'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.multiple-statements-per-line
    severity: INFO
    languages:
      - csharp
    message: >-
      Move this statement to its own line.
      One statement per line makes the code easier to read and to debug.
    pattern-either:
      - pattern-regex: '(?m)^(?![ \t]*(?://|/?\*|\[))(?![^\n]*\bfor\s*\()(?:[^\n";/]|/(?![/*])|"(?:[^"\\\n]|\\.)*")*;[ \t]+(?!(?:get|set|init|add|remove|private|protected|internal)\b)\K[A-Za-z_@](?:[^\n";]|"(?:[^"\\\n]|\\.)*")*;'
      - pattern-regex: '(?m)^[ \t]*(?:else[ \t]+)?(?:if|while|foreach|for|using|lock)\s*\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)[ \t]*\K[^\s{/;][^\n]*;'
      - pattern-regex: '(?m)\belse[ \t]+\K(?!if\b)[^\s{/][^\n]*;'
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.commented-out-code
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this commented out code.
      Commented out code distracts readers and becomes stale; version control keeps the history.
    pattern-regex: '(?m)^[ \t]*//(?!/)[ \t]*\K(?:[\w.\[\]]+(?:\([^\n]*?\))?[ \t]*(?:=|\+=|-=|\+\+|--)[^=\n][^\n]*?;|[\w.<>\[\]]+\([^\n]*?\)[ \t]*;|(?:if|for|foreach|while|switch|catch)[ \t]*\([^\n]*?\)[ \t]*\{?|return\b[^\n]*?;|(?:var|int|string|bool|long|double|object)[ \t]+\w+[^\n]*?;|[{}])[ \t]*(?://[^\n]*)?$'
    metadata:
      category: codestyle
      confidence: LOW
  - id: codacy.csharp.best-practice.else-if-without-else
    severity: INFO
    languages:
      - csharp
    message: >-
      Add a final else clause to this if-else-if chain.
      A closing else clause documents that every remaining case has been considered, even if it only throws or logs.
    patterns:
      - pattern: if ($A) $B; else if ($C) $D;
      - pattern-not: if ($A) $B; else if ($C) $D; else $E;
      - focus-metavariable: $C
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.codestyle.for-loop-only-condition
    severity: INFO
    languages:
      - csharp
    message: >-
      Replace this for loop with a while loop.
      A for loop with neither initializer nor increment is a while loop in disguise.
    pattern: for (; $C; ) $S;
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.switch-too-few-cases
    severity: INFO
    languages:
      - csharp
    message: >-
      Replace this switch with an if statement or a conditional expression, it has fewer than 3 clauses.
      A switch with only one or two branches is harder to read than the equivalent if statement.
    pattern-either:
      - pattern-regex: '(?m)^([ \t]*)(?:[^\n]*[^\w\n])?\Kswitch[ \t]*\([^\n]*?\)[ \t]*(?://[^\n]*)?\r?\n\1\{[ \t]*\r?\n(?:(?!\1\})(?![^\n]*\b(?:case\b|default[ \t]*:))[^\n]*\n)*(?:(?!\1\})[^\n]*\b(?:case\b|default[ \t]*:)[^\n]*\n(?:(?!\1\})(?![^\n]*\b(?:case\b|default[ \t]*:))[^\n]*\n)*){1,2}\1\}'
      - pattern-regex: '\bswitch[ \t]*(?://[^\n]*)?\r?\n?[ \t]*\{(?:[^{}=,;]|=(?!>))*=>[^,{}]*(?:,(?:[^{}=,;]|=(?!>))*=>[^,{}]*)?,?\s*\}'
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.correctness.switch-without-default
    severity: ERROR
    languages:
      - csharp
    message: >-
      Add a default clause to this switch statement.
      A default clause is defensive programming: it handles values that were not anticipated, such as a newly added enum member.
    patterns:
      - pattern: |
          switch ($X) { case $A: ... }
      - pattern-not: |
          switch ($X) { case $A: ... default: ... }
      - pattern-not: |
          switch ($X) { case $A: ... case $B: default: ... }
      - pattern-not: |
          switch ($X) { case $A: default: ... }
    metadata:
      category: correctness
      cwe: "CWE-478: Missing Default Case in Multiple Condition Expression"
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.issue-suppression
    severity: WARNING
    languages:
      - csharp
    message: >-
      Make sure this issue suppression is justified.
      Suppressed warnings hide potential problems and should be reviewed regularly.
    pattern-either:
      - pattern-regex: '\[[ \t]*(?:assembly:[ \t]*|module:[ \t]*)?(?:[\w.]+\.)?\KSuppressMessage(?:Attribute)?\b'
      - pattern-regex: '(?m)^[ \t]*\K#pragma[ \t]+warning[ \t]+disable\b'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.missing-copyright-header
    severity: INFO
    languages:
      - csharp
    message: >-
      Add a copyright and license header to this file.
      Each source file should state its copyright and license so that its terms of use are clear.
    pattern-regex: '\A(?!(?:\s*//[^\n]*\n)*?\s*//[^\n]*(?i:copyright|licen[cs]e|spdx)|\s*/\*(?:(?!\*/)[\s\S])*?(?i:copyright|licen[cs]e|spdx))\s*\K[^\s][^\n]*'
    metadata:
      category: best-practice
      confidence: LOW
  - id: codacy.csharp.codestyle.multiple-declarations-per-line
    severity: INFO
    languages:
      - csharp
    message: >-
      Declare each variable or field on its own line.
      Separate declarations are easier to read, comment and change.
    pattern: $T $A, $B;
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.enum-naming
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this enumeration to match the naming convention.
      Enumeration names should be PascalCase; [Flags] enumerations should use a plural name and other enumerations a singular one.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  [Flags]
                  enum $E { ... }
              - pattern: |
                  [FlagsAttribute]
                  enum $E { ... }
              - pattern: |
                  [System.Flags]
                  enum $E { ... }
          - focus-metavariable: $E
          - metavariable-regex:
              metavariable: $E
              regex: '^(?!(?:[A-Z]{1,3}[a-z0-9]+)*(?:[A-Z]{2})?s$)'
      - patterns:
          - pattern: |
              enum $E { ... }
          - pattern-not: |
              [Flags]
              enum $E { ... }
          - pattern-not: |
              [FlagsAttribute]
              enum $E { ... }
          - pattern-not: |
              [System.Flags]
              enum $E { ... }
          - focus-metavariable: $E
          - metavariable-regex:
              metavariable: $E
              regex: '^(?!(?:[A-Z]{1,3}[a-z0-9]+)*(?:[A-Z]{2})?$)'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.enum-name-suffix
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this enumeration to remove the 'Flags' or 'Enum' suffix.
      The suffix repeats information that the type declaration already carries.
    patterns:
      - pattern: |
          enum $E { ... }
      - focus-metavariable: $E
      - metavariable-regex:
          metavariable: $E
          regex: '.*(?:Flags|Enum)$'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.comprehensibility.parameter-named-like-method
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this parameter, it has the same name as its method.
      A parameter named like its method is confusing for readers and callers.
    pattern-regex: '(?m)\b(\w+)[ \t]*\((?:[^()\n]*,)?[ \t]*(?:(?:ref|out|in|params|this)[ \t]+)?[\w.]+(?:<[^()\n]*?>)?(?:\[[, ]*\])?\??[ \t]+\K(?i:\1)(?=[ \t]*[,)=])'
    metadata:
      category: comprehensibility
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.async-await-as-identifier
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this identifier, 'async' and 'await' should not be used as identifiers.
      They are contextual keywords and using them as names makes the code confusing.
    pattern-regex: '(?m)(?<![\w.])(?!(?:return|await|async|new|in|out|ref|is|as|else|case|throw|yield)\b)[A-Za-z_][\w.]*(?:<[^\n;=()]*>)?(?:\[[, ]*\])?\??[ \t]+\K(?:async|await)(?=[ \t]*(?:=(?!=)|;|,|\)))'
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.async-method-naming
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this method so that its 'Async' suffix matches whether it returns an awaitable type.
      Methods returning Task or ValueTask should end with 'Async', and other methods should not.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  Task $M(...) { ... }
              - pattern: |
                  Task<$T> $M(...) { ... }
              - pattern: |
                  ValueTask $M(...) { ... }
              - pattern: |
                  ValueTask<$T> $M(...) { ... }
              - pattern: |
                  Task $M(...) => $X;
              - pattern: |
                  Task<$T> $M(...) => $X;
              - pattern: |
                  Task $M(...);
              - pattern: |
                  Task<$T> $M(...);
          - pattern-not: |
              override $R $M(...) { ... }
          - pattern-not: |
              override $R $M(...) => $X;
          - focus-metavariable: $M
          - metavariable-regex:
              metavariable: $M
              regex: '^(?!Main$)(?!.*Async$)'
      - patterns:
          - pattern-either:
              - pattern: |
                  $R $M(...) { ... }
              - pattern: |
                  $R $M(...) => $X;
              - pattern: |
                  void $M(...) { ... }
          - pattern-not: |
              override $R $M(...) { ... }
          - pattern-not: |
              override void $M(...) { ... }
          - metavariable-regex:
              metavariable: $R
              regex: '^(?!(?:System\.Threading\.Tasks\.)?(?:Task|ValueTask)\b|IAsync)'
          - focus-metavariable: $M
          - metavariable-regex:
              metavariable: $M
              regex: '.*Async$'
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.logger-naming
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this logger field or property to match the naming convention '^_?[Ll]og(ger)?$'.
      Consistent logger names make logging calls easy to find.
    patterns:
      - pattern-either:
          - pattern: |
              class $C { ... ILogger $L; ... }
          - pattern: |
              class $C { ... ILogger<$T> $L; ... }
          - pattern: |
              class $C { ... ILog $L; ... }
          - pattern: |
              class $C { ... Logger $L; ... }
          - pattern: |
              class $C { ... ILogger $L = $V; ... }
          - pattern: |
              class $C { ... ILog $L = $V; ... }
          - pattern: |
              class $C { ... Logger $L = $V; ... }
          - pattern: |
              class $C { ... ILogger $L { get; set; } ... }
          - pattern: |
              class $C { ... ILogger $L { get; } ... }
      - focus-metavariable: $L
      - metavariable-regex:
          metavariable: $L
          regex: '^(?!_?[Ll]og(?:ger)?$)'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.best-practice.type-name-matches-namespace
    severity: WARNING
    languages:
      - csharp
    message: >-
      Rename this type, its name collides with a well-known namespace.
      A type named like a namespace forces callers to use fully qualified names to disambiguate.
    patterns:
      - pattern-either:
          - pattern: |
              public class $C { ... }
          - pattern: |
              public interface $C { ... }
          - pattern: |
              public struct $C { ... }
          - pattern: |
              public enum $C { ... }
      - focus-metavariable: $C
      - metavariable-regex:
          metavariable: $C
          regex: '^(?:System|Collections|Generic|Concurrent|ObjectModel|Specialized|IO|Text|RegularExpressions|Linq|Net|Http|Sockets|Threading|Tasks|Reflection|Runtime|InteropServices|Serialization|Security|Cryptography|Principal|Data|Xml|Diagnostics|Globalization|Resources|ComponentModel|Configuration|Drawing|Windows|Forms|Web|Json|Buffers|Numerics|Timers|Transactions)$'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.codestyle.derived-type-name-suffix
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this class so that it ends with the suffix of its base type: 'Attribute', 'EventArgs' or 'Exception'.
      Following this .NET convention lets readers recognize these types by their name.
    patterns:
      - pattern-either:
          - pattern: |
              class $C : $B { ... }
          - pattern: |
              class $C : $B, $I { ... }
          - pattern: |
              class $C : $B, $I, $J { ... }
      - metavariable-regex:
          metavariable: $B
          regex: '.*(?:Exception|Attribute|EventArgs)$'
      - metavariable-comparison:
          comparison: not re.match(".*(Exception|Attribute|EventArgs)$", str($C))
      - focus-metavariable: $C
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.lowercase-literal-suffix
    severity: INFO
    languages:
      - csharp
    message: >-
      Use an upper case 'L' suffix for this numeric literal.
      A lower case 'l' is easily confused with the digit '1'.
    patterns:
      - pattern: $N
      - metavariable-regex:
          metavariable: $N
          regex: '^(?:0[xX][\da-fA-F_]+|0[bB][01_]+|\d[\d_]*)(?:l|ul|Ul|lu|lU)$'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.large-number-without-underscores
    severity: INFO
    languages:
      - csharp
    message: >-
      Add underscores to this numeric literal to make it readable.
      Digit separators make large numbers, such as 10_000_000, much easier to read.
    patterns:
      - pattern: $N
      - metavariable-regex:
          metavariable: $N
          regex: '^(?:\d{6,}(?:\.\d+)?|0[xX][\da-fA-F]{9,}|0[bB][01]{9,})(?:[uU]?[lL]?|[lL][uU]|[fFdDmM])$'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.irregular-number-grouping
    severity: INFO
    languages:
      - csharp
    message: >-
      Group the digits of this numeric literal regularly.
      Irregular digit groups, such as 100_00, are misleading; use groups of equal size after the first one.
    patterns:
      - pattern: $N
      - metavariable-regex:
          metavariable: $N
          regex: '^(?!(?:0[xXbB])?(?:[\da-fA-F]{1,2}(?:_[\da-fA-F]{2})+|[\da-fA-F]{1,3}(?:_[\da-fA-F]{3})+|[\da-fA-F]{1,4}(?:_[\da-fA-F]{4})+|[\da-fA-F]{1,8}(?:_[\da-fA-F]{8})+)(?:\.\d+)?(?:[uU]?[lL]?|[lL][uU]|[fFdDmM])$)(?:0[xXbB])?[\da-fA-F]+(?:_[\da-fA-F]+)+(?:\.\d+)?(?:[uU]?[lL]?|[lL][uU]|[fFdDmM])$'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.conditional-on-same-line-as-brace
    severity: INFO
    languages:
      - csharp
    message: >-
      Move this if statement to a new line or add the missing 'else'.
      An if that starts on the same line as the closing brace of a previous block looks like an 'else if'.
    pattern-regex: '(?m)^(?![ \t]*(?://|/?\*))[^\n"]*\}[ \t]*\Kif[ \t]*\('
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.correctness.misleading-conditional-indentation
    severity: INFO
    languages:
      - csharp
    message: >-
      Indent the statement controlled by this conditional, or enclose it in curly braces.
      A conditionally executed statement aligned with its condition looks like it always runs.
    pattern-regex: '(?m)^([ \t]*)\K(?:(?:else[ \t]+)?if|while|for|foreach)\b[^\n{;]*\)[ \t]*(?://[^\n]*)?\r?\n\1(?![ \t]|\{|//|/\*)\S'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.multiline-block-without-braces
    severity: ERROR
    languages:
      - csharp
    message: >-
      Add curly braces, only the first statement after this conditional is part of its body.
      The indentation suggests that the following statement is also conditional, but it always runs.
    pattern-either:
      - pattern-regex: '(?m)^([ \t]*)(?:(?:else[ \t]+)?if|while|for|foreach)\b[^\n{;]*\)[ \t]*(?://[^\n]*)?\r?\n\1([ \t]+)[^\s{}/][^\n]*;[ \t]*(?://[^\n]*)?\r?\n\1\2\K(?![ \t])[^\s{}/]'
      - pattern-regex: '(?m)^[ \t]*(?:(?:else[ \t]+)?if|while|for|foreach)[ \t]*\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)[ \t]*[^\s{;/][^\n;]*;[ \t]*\K[A-Za-z_][^\n;]*;'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.goto-statement
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this 'goto' statement.
      'goto' makes the control flow hard to follow; use structured statements instead.
    pattern-regex: '(?m)^(?![ \t]*(?://|/?\*))[^\n"]*?\K\bgoto[ \t]+(?:case\b|default\b|\w+)[^\n;]*;'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.comprehensibility.empty-comment
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this empty comment.
      Empty comments add visual clutter without conveying any information.
    pattern-either:
      - pattern-regex: '(?m)(?:\A|^(?![ \t]*//)[^\n]*\n)[ \t]*\K//[ \t]*\r?$(?!\n[ \t]*//)'
      - pattern-regex: '/\*[\s*]*\*/'
    metadata:
      category: comprehensibility
      confidence: HIGH
  - id: codacy.csharp.best-practice.fixme-tag
    severity: WARNING
    languages:
      - csharp
    message: >-
      Take the required action to fix the issue indicated by this 'FIXME' comment.
      FIXME tags mark known problems that should not be forgotten.
    pattern-regex: '(?m)(?://|/\*|^[ \t]*\*)[^\n]*?\K\b(?i:fixme)\b'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.todo-tag
    severity: WARNING
    languages:
      - csharp
    message: >-
      Complete the task associated to this 'TODO' comment.
      TODO tags mark unfinished work that should be tracked and completed.
    pattern-regex: '(?m)(?://|/\*|^[ \t]*\*)[^\n]*?\K\b(?i:todo)\b'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.codestyle.redundant-parentheses-creation
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove these redundant empty parentheses.
      Empty parentheses are not needed on attributes without arguments or on object creations followed by an initializer.
    pattern-either:
      - pattern-regex: '(?m)^[ \t]*\[(?:(?:assembly|module|return|field|property|method|param|type):[ \t]*)?(?:[\w.]+(?:\([^()\]\n]*\))?[ \t]*,[ \t]*)*[\w.]+\K\([ \t]*\)(?=[ \t]*[,\]])'
      - pattern-regex: '\bnew[ \t]+[A-Za-z_][\w.]*(?:<[^()\n;]*?>)?\K\([ \t]*\)(?=\s*(?://[^\n]*\s*)?\{)'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.verbose-declaration
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove the redundant parts of this declaration or initialization.
      Empty initializers, explicit array sizes next to initializers and explicit nullable creations can be inferred by the compiler.
    pattern-either:
      - pattern-regex: '\bnew[ \t]+[A-Za-z_][\w.]*(?:<[^()\n;]*?>)?(?:\([^()\n]*\))?[ \t]*\K\{[ \t]*\}'
      - pattern-regex: '\bnew[ \t]+[A-Za-z_][\w.]*[ \t]*\K\[[ \t]*\d+[ \t]*\](?=\s*\{)'
      - pattern-regex: '\bnew[ \t]+\K(?:[A-Za-z_][\w.]*\?|Nullable<[^>\n]+>)(?=[ \t]*\()'
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.redundant-anonymous-property-name
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove the redundant property name in this anonymous type.
      The name is inferred from the variable or member used to initialize the property.
    patterns:
      - pattern-either:
          - pattern: "new { ..., $X = $Y, ... }"
          - pattern: "new { ..., $X = $O.$Y, ... }"
      - metavariable-comparison:
          comparison: str($X) == str($Y)
      - focus-metavariable: $X
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.redundant-default-initialization
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this initialization to the default value, the compiler already does it.
      Explicitly initializing fields, auto-properties or events to their default value only adds noise.
    pattern-either:
      - patterns:
          - pattern-inside: |
              class $C { ... }
          - pattern-not-inside: |
              $R $M(...) { ... }
          - pattern-not-inside: |
              $R $M(...) => $E;
          - pattern-either:
              - patterns:
                  - pattern: $T $F = $V;
                  - metavariable-regex:
                      metavariable: $T
                      regex: '^(?:sbyte|byte|short|ushort|int|uint|long|ulong|nint|nuint|float|double|decimal|char|Int16|Int32|Int64|UInt16|UInt32|UInt64|Single|Double|Decimal)$'
                  - metavariable-regex:
                      metavariable: $V
                      regex: '^(?:0+(?:\.0*)?(?:[uUlLfFdDmM]{1,2})?|0[xX]0+|''\\0'')$'
              - pattern: bool $F = false;
              - pattern: $T $F = null;
              - pattern: $T $F = default;
              - pattern: $T $F = default($X);
          - pattern-not: const $T $F = $V;
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.empty-case-before-default
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this empty case clause, it falls through to the default clause.
      Empty cases that fall through to 'default' do not change the behavior.
    pattern-regex: '(?m)^[ \t]*\Kcase\b[^:\n]*:(?=[ \t]*(?://[^\n]*)?(?:\r?\n[ \t]*case\b[^:\n]*:[ \t]*(?://[^\n]*)?)*\r?\n[ \t]*default[ \t]*:)'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.empty-default-clause
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this empty 'default' clause.
      A default clause that only breaks does nothing.
    pattern-regex: '(?m)^[ \t]*\Kdefault[ \t]*:\s*break[ \t]*;'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.redundant-jump
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this redundant jump statement.
      A 'return' at the end of a void method, a 'continue' at the end of a loop or a 'goto' to the next statement change nothing.
    pattern-either:
      - patterns:
          - pattern: return;
          - pattern-inside: |
              void $M(...) { ... }
          - pattern-not-inside: if ($C) $S;
          - pattern-not-inside: while ($C) $S;
          - pattern-not-inside: do $S; while ($C);
          - pattern-not-inside: for ($T $I = $X; $C; $U) $S;
          - pattern-not-inside: foreach ($T $V in $E) $S;
          - pattern-not-inside: foreach (var $V in $E) $S;
          - pattern-not-inside: |
              switch ($X) { case $A: ... }
          - pattern-not-inside: |
              try { ... }
          - pattern-not-inside: |
              using (...) { ... }
          - pattern-not-inside: |
              lock ($L) { ... }
          - pattern-not-inside: |
              () => { ... }
          - pattern-not-inside: |
              ($P) => { ... }
          - pattern-not-inside: |
              $P => { ... }
          - pattern-not-inside: |
              delegate (...) { ... }
          - pattern-not-inside: |
              return;
              ...
              $S;
          - pattern-regex: '\breturn[ \t]*;(?=[ \t]*(?://[^\n]*)?\s*\}[ \t]*(?://[^\n]*)?\r?\n)'
      - patterns:
          - pattern-either:
              - pattern: while ($C) $BODY
              - pattern: foreach ($T $V in $E) $BODY
              - pattern: foreach (var $V in $E) $BODY
              - pattern: for ($T $I = $X; $C; $U) $BODY
          - metavariable-regex:
              metavariable: $BODY
              regex: '(?s)^\{.*\n[ \t]*continue[ \t]*;[ \t]*(?://[^\n]*)?\s*\}\z'
          - pattern-regex: '\bcontinue[ \t]*;(?=[ \t]*(?://[^\n]*)?\s*\})'
      - pattern-regex: '\bgoto[ \t]+(\w+)[ \t]*;(?:[ \t]*//[^\n]*)?\s*\1[ \t]*:'
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.default-clause-position
    severity: INFO
    languages:
      - csharp
    message: >-
      Move this default clause to the beginning or the end of the switch statement.
      A default clause in the middle of the cases is easy to miss.
    pattern-regex: '(?m)^([ \t]*)case\b[^\n]*\n(?:(?:\1[ \t]+[^\n]*|[ \t]*|\1case\b[^\n]*)\n)*\1\Kdefault[ \t]*:[^\n]*\n(?:(?:\1[ \t]+[^\n]*|[ \t]*)\n)*\1case\b'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.inverted-boolean-check
    severity: INFO
    languages:
      - csharp
    message: >-
      Use the opposite operator instead of negating this comparison.
      Writing '!(a == b)' instead of 'a != b' makes the condition harder to read.
    pattern-either:
      - pattern: "!($A == $B)"
      - pattern: "!($A != $B)"
      - pattern: "!($A < $B)"
      - pattern: "!($A > $B)"
      - pattern: "!($A <= $B)"
      - pattern: "!($A >= $B)"
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.redundant-modifier
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this redundant modifier.
      'sealed' members of sealed classes and 'checked' or 'unchecked' blocks without integral arithmetic have no effect.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  sealed class $C { ... sealed override $R $M(...) { ... } ... }
              - pattern: |
                  sealed class $C { ... sealed override $R $M(...) => $E; ... }
          - focus-metavariable: $M
      - pattern-regex: '\b(?:un)?checked[ \t]*(?://[^\n]*)?\s*\{(?![^{}]*(?:\+|-|\*|/|%|<<|>>))[^{}]*\}'
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.trivial-property
    severity: INFO
    languages:
      - csharp
    message: >-
      Make this an auto-implemented property and remove its backing field.
      A property that only reads and writes a field adds boilerplate without adding behavior.
    patterns:
      - pattern-either:
          - pattern: |
              class $C { ... $FT $F; ... $T $P { get { return $F; } set { $F = value; } } ... }
          - pattern: |
              class $C { ... $FT $F; ... $T $P { get => $F; set => $F = value; } ... }
          - pattern: |
              class $C { ... $T $P { get { return $F; } set { $F = value; } } ... $FT $F; ... }
          - pattern: |
              class $C { ... $T $P { get => $F; set => $F = value; } ... $FT $F; ... }
      - focus-metavariable: $P
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.simplify-conditional
    severity: INFO
    languages:
      - csharp
    message: >-
      Simplify this conditional using '??', '??=' or the conditional operator.
      The shorter syntax expresses the same logic with less code.
    pattern-either:
      - pattern: |
          if ($A != null) { $X = $A; } else { $X = $B; }
      - pattern: |
          if ($A == null) { $X = $B; } else { $X = $A; }
      - pattern: |
          if ($C) { $X = $A; } else { $X = $B; }
      - pattern: |
          if ($C) $X = $A; else $X = $B;
      - pattern: "$A != null ? $A : $B"
      - pattern: "$A == null ? $B : $A"
      - pattern: "null != $A ? $A : $B"
      - pattern: "null == $A ? $B : $A"
      - pattern: null ?? $B
      - pattern: $A = $A ?? $B
      - patterns:
          - pattern-either:
              - pattern: |
                  if ($A == null) { $A = $B; }
              - pattern: |
                  if ($A == null) $A = $B;
              - pattern: |
                  if (null == $A) { $A = $B; }
          - pattern-not: if ($A == null) $S; else $E;
          - pattern-not: if (null == $A) $S; else $E;
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.redundant-constructor-or-destructor
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this redundant constructor, destructor or base constructor call.
      The compiler generates a public parameterless constructor and calls the base parameterless constructor automatically, and empty static constructors and destructors are useless.
    pattern-either:
      - patterns:
          - pattern-inside: |
              class $C { ... public $C() { } ... }
          - pattern-not-inside: |
              class $C { ... $C($P, ...) { ... } ... }
          - pattern-not-inside: |
              class $C { ... $C($P, ...) : base(...) { ... } ... }
          - pattern-not-inside: |
              class $C { ... $C($P, ...) : this(...) { ... } ... }
          - pattern-regex: 'public[ \t]+\w+[ \t]*\([ \t]*\)[ \t]*\{\s*\}'
      - pattern-regex: '(?m)^[ \t]*\Kstatic[ \t]+\w+[ \t]*\([ \t]*\)[ \t]*\{\s*\}'
      - pattern-regex: '(?m)^[ \t]*\K~\w+[ \t]*\([ \t]*\)[ \t]*\{\s*\}'
      - pattern-regex: '\)[ \t]*(?:\r?\n[ \t]*)?:[ \t]*\Kbase[ \t]*\([ \t]*\)'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.correctness.throw-in-finalizer
    severity: ERROR
    languages:
      - csharp
    message: >-
      Remove this 'throw' statement from the finalizer.
      An exception thrown from a finalizer terminates the process and prevents other finalizers from running.
    patterns:
      - pattern-either:
          - pattern: throw $E;
          - pattern: throw;
      - pattern-regex: '~\w+[ \t]*\([ \t]*\)\s*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.throw-in-finally
    severity: ERROR
    languages:
      - csharp
    message: >-
      Remove this 'throw' statement from the finally block.
      An exception thrown from a finally block replaces and hides any exception thrown in the try or catch blocks.
    patterns:
      - pattern: throw $E;
      - pattern-regex: '\bfinally\s*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
      - pattern-not-inside: |
          try { ... } catch ($T $V) { ... }
      - pattern-not-inside: |
          try { ... } catch { ... }
      - pattern-not-inside: |
          ($P) => { ... }
      - pattern-not-inside: |
          $P => { ... }
      - pattern-not-inside: |
          () => { ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.equals-without-gethashcode
    severity: ERROR
    languages:
      - csharp
    message: >-
      Override both Equals(object) and GetHashCode(), or neither of them.
      Objects that are equal must have the same hash code, otherwise hash-based collections such as Dictionary and HashSet behave incorrectly.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      class $C { ... override bool Equals($T $O) { ... } ... }
                  - pattern: |
                      class $C { ... override bool Equals($T $O) => $E; ... }
                  - pattern: |
                      struct $C { ... override bool Equals($T $O) { ... } ... }
                  - pattern: |
                      struct $C { ... override bool Equals($T $O) => $E; ... }
              - pattern-not: |
                  class $C { ... override int GetHashCode() { ... } ... }
              - pattern-not: |
                  class $C { ... override int GetHashCode() => $H; ... }
              - pattern-not: |
                  struct $C { ... override int GetHashCode() { ... } ... }
              - pattern-not: |
                  struct $C { ... override int GetHashCode() => $H; ... }
          - patterns:
              - pattern-either:
                  - pattern: |
                      class $C { ... override int GetHashCode() { ... } ... }
                  - pattern: |
                      class $C { ... override int GetHashCode() => $H; ... }
                  - pattern: |
                      struct $C { ... override int GetHashCode() { ... } ... }
                  - pattern: |
                      struct $C { ... override int GetHashCode() => $H; ... }
              - pattern-not: |
                  class $C { ... override bool Equals($T $O) { ... } ... }
              - pattern-not: |
                  class $C { ... override bool Equals($T $O) => $E; ... }
              - pattern-not: |
                  struct $C { ... override bool Equals($T $O) { ... } ... }
              - pattern-not: |
                  struct $C { ... override bool Equals($T $O) => $E; ... }
      - focus-metavariable: $C
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.icomparable-without-equality-operators
    severity: ERROR
    languages:
      - csharp
    message: >-
      Override Equals(object) and the comparison operators in this IComparable implementation.
      Types that define an ordering are expected to behave consistently with Equals and with the ==, !=, <, <=, > and >= operators.
    pattern-either:
      - patterns:
          - pattern-regex: '\b(?:class|struct)\s+\K\w+(?=[^{;]*:[^{;]*\bIComparable\b)'
          - pattern-not-inside: |
              class $C { ... override bool Equals($T $O) { ... } ... }
          - pattern-not-inside: |
              class $C { ... override bool Equals($T $O) => $E; ... }
          - pattern-not-inside: |
              struct $C { ... override bool Equals($T $O) { ... } ... }
          - pattern-not-inside: |
              struct $C { ... override bool Equals($T $O) => $E; ... }
      - patterns:
          - pattern-regex: '\b(?:class|struct)\s+\K\w+(?=[^{;]*:[^{;]*\bIComparable\b)'
          - pattern-not-inside: |
              class $C { ... static bool operator <($A $X, $B $Y) { ... } ... }
          - pattern-not-inside: |
              class $C { ... static bool operator <($A $X, $B $Y) => $E; ... }
          - pattern-not-inside: |
              struct $C { ... static bool operator <($A $X, $B $Y) { ... } ... }
          - pattern-not-inside: |
              struct $C { ... static bool operator <($A $X, $B $Y) => $E; ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.parameter-overwritten-before-read
    severity: WARNING
    languages:
      - csharp
    message: >-
      Read the initial value of this parameter or caught exception before overwriting it.
      Overwriting a parameter before it is read discards the value passed by the caller and is likely a bug.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $R $M(..., $T $P, ...) { $P = $X; ... }
              - pattern-inside: |
                  $M(..., $T $P, ...) { $P = $X; ... }
          - pattern: $P = $X;
          - pattern-not-inside: |
              $R $M(..., out $T $P, ...) { ... }
          - pattern-not-inside: |
              $R $M(..., ref $T $P, ...) { ... }
          - pattern-not: $P = <... $P ...>;
      - patterns:
          - pattern-inside: |
              try { ... } catch ($T $P) { $P = $X; ... }
          - pattern: $P = $X;
          - pattern-not: $P = <... $P ...>;
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.floating-point-equality
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not check floating point values for equality with '==' or '!='.
      Floating point arithmetic is imprecise; compare the absolute difference with a tolerance instead.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-type:
                  metavariable: $A
                  types: [float, double]
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-type:
                  metavariable: $B
                  types: [float, double]
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-regex:
                  metavariable: $A
                  regex: '^-?(?:\d+\.\d+(?:[eE][+-]?\d+)?[fFdD]?|\d+[fFdD])$'
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-regex:
                  metavariable: $B
                  regex: '^-?(?:\d+\.\d+(?:[eE][+-]?\d+)?[fFdD]?|\d+[fFdD])$'
      - metavariable-comparison:
          comparison: str($A) != str($B)
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.loop-counter-modified-in-body
    severity: WARNING
    languages:
      - csharp
    message: >-
      Do not update the loop counter inside the body of this for loop.
      A for loop whose counter is also changed in its body is hard to understand and its stop condition is no longer invariant.
    patterns:
      - pattern-inside: for ($T $I = $X; $C; $U) $BODY
      - pattern-either:
          - pattern: $I = $V
          - pattern: $I += $V
          - pattern: $I -= $V
          - pattern: $I++
          - pattern: $I--
          - pattern: ++$I
          - pattern: --$I
      - pattern-not-regex: '(?m)^[ \t]*for[ \t]*\([^\n]*'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.self-assignment
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove or correct this useless self-assignment.
      Assigning a variable to itself has no effect and usually hides a mistake, such as a missing 'this.'.
    pattern: $X = $X;
    options:
      constant_propagation: false
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.catch-null-reference-exception
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not catch NullReferenceException; test for null instead.
      Catching it hides programming errors and is much slower than a null check.
    pattern-regex: '\bcatch[ \t]*\([ \t]*(?:System\.)?\KNullReferenceException\b'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.overridable-call-in-constructor
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not call overridable methods from a constructor.
      An override runs before the derived class constructor has initialized its state, which can lead to unexpected behavior.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C { ... virtual $R $M(...) { ... } ... }
          - pattern-inside: |
              class $C { ... virtual $R $M(...) => $E; ... }
          - pattern-inside: |
              class $C { ... abstract $R $M(...); ... }
      - pattern-not-inside: |
          sealed class $C { ... }
      - pattern-either:
          - pattern: $M(...)
          - pattern: this.$M(...)
      - pattern-regex: '(?m)^[ \t]*(?:(?:public|protected|internal|private)[ \t]+)*(?!(?:if|while|for|foreach|switch|catch|using|lock|fixed|return|new|else)\b)[A-Z]\w*[ \t]*\((?:[^()]|\([^()]*\))*\)\s*(?::\s*(?:base|this)\s*\((?:[^()]|\([^()]*\))*\)\s*)?\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.best-practice.loop-with-single-iteration
    severity: WARNING
    languages:
      - csharp
    message: >-
      Refactor this loop, it executes at most once.
      A loop body that always ends with an unconditional break, return or throw is a disguised if statement.
    patterns:
      - pattern-either:
          - pattern: while ($C) $BODY
          - pattern: foreach ($T $V in $E) $BODY
          - pattern: foreach (var $V in $E) $BODY
          - pattern: for ($T $I = $X; $C; $U) $BODY
      - metavariable-regex:
          metavariable: $BODY
          regex: '(?s)^\{(?!.*\bcontinue\b).*\n[ \t]*(?:break|return\b[^;\n]*|throw\b[^;\n]*)[ \t]*;[ \t]*(?://[^\n]*)?\s*\}\z'
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.correctness.identical-operands
    severity: WARNING
    languages:
      - csharp
    message: >-
      Correct one of the identical expressions on both sides of this operator.
      Using the same expression on both sides of a comparison or logical operator is either useless or a copy-paste mistake.
    pattern-either:
      - pattern: $X == $X
      - pattern: $X != $X
      - pattern: $X < $X
      - pattern: $X > $X
      - pattern: $X <= $X
      - pattern: $X >= $X
      - pattern: $X && $X
      - pattern: $X || $X
      - pattern: $X & $X
      - pattern: $X | $X
      - pattern: $X ^ $X
      - pattern: $X - $X
      - pattern: $X / $X
      - pattern: $X % $X
      - pattern: $X.Equals($X)
      - pattern: object.Equals($X, $X)
      - pattern: ReferenceEquals($X, $X)
      - pattern: object.ReferenceEquals($X, $X)
