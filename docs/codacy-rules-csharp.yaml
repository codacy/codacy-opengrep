      - patterns:
          - pattern-either:
              - pattern: while (true) $BODY
              - pattern: for (;;) $BODY
          - metavariable-regex:
              metavariable: $BODY
              regex: '^(?![\s\S]*\b(?:break|return|throw|goto|yield\s+break|Exit)\b)'
      - patterns:
          - pattern-either:
              - pattern: |
                  $R $M() { return $M(); }
              - pattern: |
                  $R $M() => $M();
              - pattern: |
                  $R $M($T1 $A) { return $M($A); }
              - pattern: |
                  $R $M($T1 $A) => $M($A);
              - pattern: |
                  $R $M($T1 $A, $T2 $B) { return $M($A, $B); }
              - pattern: |
                  void $M() { $M(); }
              - pattern: |
                  void $M($T1 $A) { $M($A); }
          - focus-metavariable: $M
      - patterns:
          - pattern-either:
              - pattern: |
                  class $C { ... $T $P { get { return $P; } } ... }
              - pattern: |
