      - pattern: for ($T $I = $X; $I < $Y; $I--) $S;
      - pattern: for ($T $I = $X; $I <= $Y; $I--) $S;
      - pattern: for ($T $I = $X; $I < $Y; --$I) $S;
      - pattern: for ($T $I = $X; $I <= $Y; --$I) $S;
      - pattern: for ($T $I = $X; $I < $Y; $I -= $N) $S;
      - pattern: for ($T $I = $X; $I <= $Y; $I -= $N) $S;
      - pattern: for ($T $I = $X; $I > $Y; $I++) $S;
      - pattern: for ($T $I = $X; $I >= $Y; $I++) $S;
      - pattern: for ($T $I = $X; $I > $Y; ++$I) $S;
      - pattern: for ($T $I = $X; $I >= $Y; ++$I) $S;
      - pattern: for ($T $I = $X; $I > $Y; $I += $N) $S;
      - pattern: for ($T $I = $X; $I >= $Y; $I += $N) $S;
