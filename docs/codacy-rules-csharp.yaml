  - id: codacy.csharp.correctness.exception-rethrown-explicitly
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use 'throw;' instead of 'throw ex;' to rethrow this exception.
      Rethrowing the exception variable resets its stack trace and loses the original failure location.
    pattern-regex: '\bcatch\s*\(\s*[\w.]+\s+(\w+)\s*\)\s*(?:when\s*\((?:[^()]|\([^()]*\))*\)\s*)?\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*?\K\bthrow\s+\1\s*;'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.optional-on-ref-or-out-parameter
    severity: ERROR
    languages:
      - csharp
    message: >-
      Remove the [Optional] attribute from this ref or out parameter.
      Callers must always provide ref and out arguments, so the attribute is misleading.
    pattern-regex: '\[[ \t]*(?:System\.Runtime\.InteropServices\.)?Optional(?:Attribute)?[ \t]*\]\s*\K(?:ref|out)\b'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.invalid-dynamic-shift-operand
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use an integer as the right operand of this shift operation.
      With a dynamic left operand, a non-integer shift count compiles but throws a RuntimeBinderException.
