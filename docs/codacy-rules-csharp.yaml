      - patterns:
          - pattern-either:
              - pattern: $A | $B
              - pattern: $A & $B
          - metavariable-pattern:
              metavariable: $A
              pattern-either:
                - pattern: $X == $Y
                - pattern: $X != $Y
                - pattern: $X < $Y
                - pattern: $X > $Y
                - pattern: $X <= $Y
                - pattern: $X >= $Y
                - pattern: "!$X"
                - pattern: $X is $Y
      - patterns:
          - pattern-either:
