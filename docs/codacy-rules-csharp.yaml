  - id: codacy.csharp.correctness.lock-not-released-on-all-paths
    severity: ERROR
    languages:
      - csharp
    message: >-
      Release this lock in a finally block so that it is released on all execution paths.
      A lock that is not released when an exception occurs or an early return happens can cause deadlocks.
    pattern-either:
      - patterns:
          - pattern: $L.Enter($X);
          - pattern-inside: |
              $R $M(...) { ... $L.Exit($X); ... }
          - pattern-not-inside: |
              $R $M(...) { ... try { ... } finally { ... $L.Exit($X); ... } ... }
