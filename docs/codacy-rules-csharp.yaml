    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.best-practice.duplicate-branch
    severity: WARNING
    languages:
      - csharp
    message: >-
      Merge this branch with the identical branch earlier in the same conditional structure.
      Two branches with the same implementation are either duplicated code or a copy-paste mistake.
    patterns:
      - pattern-inside: if ($C) $S; else $REST;
      - pattern: if ($D) $S;
      - pattern-not: if ($C) $S; else $REST;
