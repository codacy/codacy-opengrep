          metavariable: $B
          regex: '^(?:SELECT|FROM|WHERE|SET|VALUES|INTO|JOIN|INNER|LEFT|RIGHT|OUTER|ORDER|GROUP|HAVING|AND|OR|LIMIT|UNION)\b'
      - focus-metavariable: $B
    options:
      constant_propagation: false
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.unconstrained-generic-null-comparison
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use 'default' or add a 'class' constraint instead of comparing this unconstrained generic value with null.
      When the type argument is a value type, the comparison is always false.
    patterns:
      - pattern-either:
          - pattern: $X == null
          - pattern: $X != null
          - pattern: null == $X
          - pattern: null != $X
      - pattern-inside: |
          $R $M<$T>(..., $T $X, ...) { ... }
      - pattern-not-inside: |
          $R $M<$T>(..., $T $X, ...) where $T : class { ... }
      - pattern-not-inside: |
          $R $M<$T>(..., $T $X, ...) where $T : class, $C2 { ... }
      - pattern-not-inside: |
          $R $M<$T>(..., $T $X, ...) where $T : notnull { ... }
      - pattern-not-inside: |
