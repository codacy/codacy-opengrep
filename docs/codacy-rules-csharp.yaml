          - pattern-inside: |
              $R $M(...) { ... $L.$EXIT(); ... }
          - metavariable-regex:
              metavariable: $EXIT
              regex: '^(?:ExitReadLock|ExitWriteLock|ExitUpgradeableReadLock|ReleaseMutex|Release)$'
          - pattern-not-inside: |
              $R $M(...) { ... try { ... } finally { ... $L.$EXIT(); ... } ... }
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.null-pointer-dereference
    severity: ERROR
    languages:
      - csharp
    message: >-
      Do not dereference this variable, it is null at this point.
      Accessing a member of a null reference throws a NullReferenceException.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $T $X = null;
                  ...
              - pattern-not-inside: |
                  $T $X = null;
                  ...
                  $X = $Y;
                  ...
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      if ($X == null) { ... }
                      ...
                  - pattern-inside: |
                      if ($X is null) { ... }
                      ...
              - pattern-not-inside: |
                  if ($X == null) { ... return ...; }
                  ...
              - pattern-not-inside: |
                  if ($X == null) { ... throw ...; }
                  ...
              - pattern-not-inside: |
                  if ($X == null) { ... $X = $Y; ... }
                  ...
              - pattern-not-inside: |
                  if ($X is null) { ... return ...; }
                  ...
              - pattern-not-inside: |
                  if ($X is null) { ... throw ...; }
                  ...
              - pattern-not-inside: |
                  if ($X is null) { ... $X = $Y; ... }
                  ...
              - pattern-not-inside: |
                  if ($X == null) { ... continue; }
                  ...
              - pattern-not-inside: |
                  if ($X == null) { ... break; }
                  ...
              - pattern-not-inside: |
                  if ($X == null) $A; else $B;
                  ...
              - pattern-not-inside: |
                  if ($X is null) $A; else $B;
                  ...
      - pattern: $X.$F
      - pattern-not: $X.Value
      - pattern-not: $X.HasValue
      - pattern-not: $X.GetValueOrDefault
      - pattern-not-inside: $X = $Y
      - pattern-not-inside: if (<... $X != null ...>) $S;
      - pattern-not-inside: if (<... $X is not null ...>) $S;
      - pattern-not-inside: $X != null && $E
      - pattern-not-inside: $X == null || $E
      - pattern-not-inside: |
          ($P) => $E
      - pattern-not-inside: |
          () => $E
    options:
      constant_propagation: false
    metadata:
      category: correctness
      cwe: "CWE-476: NULL Pointer Dereference"
      confidence: MEDIUM
  - id: codacy.csharp.correctness.ill-formed-format-string
    severity: ERROR
    languages:
      - csharp
    message: >-
      Correct this composite format string, it is malformed or references a missing argument.
      String.Format throws a FormatException at runtime when braces are unbalanced or an index is out of range.
    patterns:
      - pattern-either:
          - pattern: string.Format("$F", ...)
          - pattern: String.Format("$F", ...)
          - pattern: $SB.AppendFormat("$F", ...)
          - pattern: Console.WriteLine("$F", $A1, ...)
          - pattern: Console.Write("$F", $A1, ...)
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $M("$F", ...)
                  - pattern: $O.$M("$F", ...)
              - metavariable-regex:
                  metavariable: $F
                  regex: '^(?!(?:[^{}]|\{\{|\}\}|\{\s*\d+\s*(?:,\s*-?\d+\s*)?(?::[^{}]*)?\})*$)'
          - patterns:
              - pattern-either:
                  - pattern: $M("$F")
                  - pattern: $O.$M("$F")
              - pattern-not: Console.WriteLine("$F")
              - pattern-not: Console.Write("$F")
              - metavariable-regex:
                  metavariable: $F
                  regex: '(?s).*(?<!\{)\{\s*\d'
          - patterns:
              - pattern-either:
                  - pattern: $M("$F", $A1)
                  - pattern: $O.$M("$F", $A1)
              - metavariable-regex:
                  metavariable: $F
                  regex: '(?s).*(?<!\{)\{\s*(?:[1-9]|\d{2,})'
          - patterns:
              - pattern-either:
                  - pattern: $M("$F", $A1, $A2)
                  - pattern: $O.$M("$F", $A1, $A2)
              - metavariable-regex:
                  metavariable: $F
                  regex: '(?s).*(?<!\{)\{\s*(?:[2-9]|\d{2,})'
          - patterns:
              - pattern-either:
                  - pattern: $M("$F", $A1, $A2, $A3)
                  - pattern: $O.$M("$F", $A1, $A2, $A3)
              - metavariable-regex:
                  metavariable: $F
                  regex: '(?s).*(?<!\{)\{\s*(?:[3-9]|\d{2,})'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.virtual-field-like-event
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove the 'virtual' modifier of this field-like event, or implement its add and remove accessors.
      The compiler generates a separate backing field for each override, so subscribers of the base event are never notified.
