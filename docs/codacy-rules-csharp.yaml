      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.non-existent-operator
    severity: WARNING
    languages:
      - csharp
    message: >-
      Replace '=+', '=-' or '=!' with the intended operator, or remove the space after the unary operator.
