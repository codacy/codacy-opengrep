              - pattern: $A & $B
          - metavariable-pattern:
              metavariable: $B
              pattern-either:
                - pattern: $X == $Y
                - pattern: $X != $Y
                - pattern: $X < $Y
                - pattern: $X > $Y
                - pattern: $X <= $Y
                - pattern: $X >= $Y
                - pattern: "!$X"
                - pattern: $X is $Y
