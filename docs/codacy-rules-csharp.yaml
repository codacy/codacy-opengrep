              - pattern-inside: |
                  $R $M(..., float $A, ...) { ... }
              - pattern-inside: |
                  float $A = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $B
              regex: '^(?:double|Double|System\.Double)\.(?:MaxValue|MinValue)$'
      - patterns:
          - pattern-either:
              - pattern: $A < $B
              - pattern: $A <= $B
              - pattern: $A > $B
              - pattern: $A >= $B
          - pattern-either:
              - pattern-inside: |
                  $R $M(..., int $A, ...) { ... }
              - pattern-inside: |
                  int $A = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $B
              regex: '^(?:long|Int64|System\.Int64|ulong|UInt64)\.(?:MaxValue|MinValue)$'
      - patterns:
          - pattern-either:
              - pattern: $A < $B
              - pattern: $A <= $B
              - pattern: $A > $B
              - pattern: $A >= $B
          - pattern-either:
              - pattern-inside: |
                  $R $M(..., byte $A, ...) { ... }
              - pattern-inside: |
                  byte $A = $INIT;
                  ...
              - pattern-inside: |
                  $R $M(..., ushort $A, ...) { ... }
              - pattern-inside: |
                  ushort $A = $INIT;
                  ...
              - pattern-inside: |
                  $R $M(..., uint $A, ...) { ... }
              - pattern-inside: |
                  uint $A = $INIT;
                  ...
              - pattern-inside: |
                  $R $M(..., ulong $A, ...) { ... }
              - pattern-inside: |
                  ulong $A = $INIT;
                  ...
              - pattern-inside: |
                  $R $M(..., char $A, ...) { ... }
              - pattern-inside: |
                  char $A = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $B
              regex: '^-\d+$'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.ignored-return-value
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use the return value of this method call, the method has no side effects.
      Methods such as LINQ queries, string methods or DateTime arithmetic return a new value instead of changing the receiver.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $X.$M(...);
              - metavariable-regex:
                  metavariable: $M
                  regex: '^(?:Where|Select|SelectMany|Any|All|Count|LongCount|First|FirstOrDefault|Last|LastOrDefault|Single|SingleOrDefault|OrderBy|OrderByDescending|ThenBy|ThenByDescending|GroupBy|Distinct|DistinctBy|Concat|Union|Intersect|Except|Skip|SkipWhile|Take|TakeWhile|Zip|ToList|ToArray|ToDictionary|ToHashSet|ToLookup|Sum|Min|Max|Average|Aggregate|Cast|OfType|ElementAt|ElementAtOrDefault|DefaultIfEmpty|SequenceEqual|AsEnumerable)$'
