          - pattern-either:
              - pattern: $X << $N
              - pattern: $X >> $N
          - pattern-either:
              - pattern-inside: |
                  $R $M(..., int $X, ...) { ... }
              - pattern-inside: |
                  int $X = $INIT;
                  ...
              - pattern-inside: |
                  $R $M(..., uint $X, ...) { ... }
              - pattern-inside: |
                  uint $X = $INIT;
                  ...
          - metavariable-regex:
              metavariable: $N
              regex: '^\d+$'
          - metavariable-comparison:
              comparison: int($N) > 31
      - patterns:
          - pattern-either:
              - pattern: $X << $N
              - pattern: $X >> $N
          - metavariable-regex:
              metavariable: $N
              regex: '^\d+$'
          - metavariable-comparison:
              comparison: int($N) > 63
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.integer-division-to-floating-point
    severity: WARNING
    languages:
      - csharp
    message: >-
      Cast one of the operands of this integer division to a floating point type.
      The division is computed with integers, so the fractional part is lost before the result is converted.
    patterns:
      - pattern-either:
          - pattern: double $X = $A / $B;
          - pattern: float $X = $A / $B;
          - pattern: decimal $X = $A / $B;
      - metavariable-pattern:
          metavariable: $A
          pattern-either:
            - pattern: (int $Z)
            - pattern: (long $Z)
            - pattern: (short $Z)
            - pattern: (byte $Z)
            - patterns:
                - pattern: $Z
                - metavariable-regex:
                    metavariable: $Z
                    regex: '^\d+[lLuU]*$'
      - metavariable-pattern:
          metavariable: $B
          pattern-either:
            - pattern: (int $Z)
            - pattern: (long $Z)
            - pattern: (short $Z)
            - pattern: (byte $Z)
            - patterns:
                - pattern: $Z
                - metavariable-regex:
                    metavariable: $Z
                    regex: '^\d+[lLuU]*$'
      - focus-metavariable: $A
