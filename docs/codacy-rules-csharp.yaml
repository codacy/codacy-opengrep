      These objects can be locked by unrelated code, which can cause deadlocks.
    pattern-either:
      - pattern: lock (this) { ... }
      - pattern: lock (typeof($T)) { ... }
      - pattern: lock ("$S") { ... }
      - pattern: lock ((string $S)) { ... }
      - pattern: lock ($X.GetType()) { ... }
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.condition-always-false
    severity: ERROR
    languages:
      - csharp
    message: >-
      Change this condition so that it does not always evaluate to false.
      The code guarded by an always false condition is unreachable.
    patterns:
      - pattern-either:
          - pattern: if ($C) $S;
          - pattern: while ($C) $S;
