  - id: codacy.csharp.best-practice.for-update-not-loop-counter
    severity: WARNING
    languages:
      - csharp
    message: >-
      Update the loop counter in the increment clause of this for loop.
      An increment clause that does not change the loop counter is confusing and may cause an infinite loop.
