      - pattern: |
          class $C { ... private $C(...) { ... } ... }
      - pattern-not: |
          class $C { ... public $C(...) { ... } ... }
      - pattern-not: |
          class $C { ... protected $C(...) { ... } ... }
      - pattern-not: |
          class $C { ... internal $C(...) { ... } ... }
      - pattern-not: |
          class $C { ... static $R $M(...) { ... } ... }
      - pattern-not: |
          class $C { ... static $R $M(...) => $E; ... }
      - pattern-not: |
          class $C { ... static $T $F = $V; ... }
      - pattern-not: |
          class $C { ... static $T $P { get; } ... }
      - pattern-not: |
          class $C { ... static $T $P { get; } = $V; ... }
      - pattern-not: |
          class $C { ... static $T $P { get; set; } ... }
      - pattern-not: |
          class $C { ... static $T $P => $E; ... }
      - pattern-not: |
          static class $C { ... }
      - pattern-not: |
          class $C : SafeHandle { ... }
      - pattern-not-inside: |
          class $O { ... class $C { ... } ... }
      - focus-metavariable: $C
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.recursive-type-inheritance
    severity: ERROR
    languages:
      - csharp
    message: >-
      Remove this recursive type inheritance.
      A generic type that inherits from itself causes a TypeLoadException at runtime.
    pattern-regex: '\bclass[ \t]+(\w+)[ \t]*<[^>{]*>[ \t]*:[ \t]*\K\1[ \t]*<'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.disposable-not-disposed
    severity: ERROR
    languages:
      - csharp
    message: >-
      Dispose this object, or create it in a using statement.
      Objects that hold unmanaged resources such as files, sockets or images must be disposed to release those resources promptly.
    patterns:
      - pattern-inside: |
          $R $M(...) { ... }
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: var $X = new $T(...);
                  - pattern: $TY $X = new $T(...);
              - metavariable-regex:
                  metavariable: $T
                  regex: '^(?:System\.IO\.)?(?:FileStream|Bitmap|Image|WebClient|TcpClient|UdpClient|Socket|CancellationTokenSource|SqlConnection|SqlCommand|Mutex|Semaphore|SemaphoreSlim|Timer)$'
          - patterns:
              - pattern-either:
                  - pattern: var $X = new $T((string $A), ...);
                  - pattern: $TY $X = new $T((string $A), ...);
              - metavariable-regex:
                  metavariable: $T
                  regex: '^(?:System\.IO\.)?(?:StreamReader|StreamWriter)$'
          - pattern: var $X = File.Create(...);
          - pattern: var $X = File.Open(...);
          - pattern: var $X = Image.FromFile(...);
          - pattern: var $X = Image.FromStream(...);
          - pattern: $TY $X = File.Create(...);
          - pattern: $TY $X = File.Open(...);
      - pattern-not-regex: '\busing[ \t]+(?:var|[\w.<>]+)[ \t]+\w+[ \t]*=[^;]*;'
      - pattern-not-inside: using (...) $S;
      - pattern-not-inside: |
          $R $M(...) { ... $X.Dispose(); ... }
      - pattern-not-inside: |
          $R $M(...) { ... $X?.Dispose(); ... }
      - pattern-not-inside: |
          $R $M(...) { ... $X.Close(); ... }
      - pattern-not-inside: |
          $R $M(...) { ... await $X.DisposeAsync(); ... }
      - pattern-not-inside: |
          $R $M(...) { ... return <... $X ...>; ... }
      - pattern-not-inside: |
          $R $M(...) { ... $F(..., <... $X ...>, ...); ... }
      - pattern-not-inside: |
          $R $M(...) { ... $O.$F(..., <... $X ...>, ...); ... }
      - pattern-not-inside: |
          $R $M(...) { ... $Y = <... $X ...>; ... }
      - pattern-not-inside: |
          $R $M(...) { ... using (<... $X ...>) $S; ... }
