      - focus-metavariable: $C
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.condition-always-true
    severity: ERROR
    languages:
      - csharp
    message: >-
      Change this condition so that it does not always evaluate to true.
      An always true condition makes the check gratuitous and any else branch unreachable.
    patterns:
      - pattern-either:
          - pattern: if ($C) $S;
          - pattern: "$C ? $A : $B"
      - metavariable-pattern:
          metavariable: $C
          pattern: "true"
      - metavariable-regex:
          metavariable: $C
          regex: '^(?!.*\b(?:true|false)\b)(?:\w+|[\w.]+[ \t]*(?:==|!=|<=|>=|<|>)[ \t]*[\w.]+)$'
      - pattern-not-inside: |
          const bool $C = $V;
          ...
      - pattern-not-inside: |
          class $K { ... const bool $C = $V; ... }
      - focus-metavariable: $C
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.stream-read-result-ignored
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use the number of bytes returned by this Read call.
      Stream.Read may return fewer bytes than requested, so ignoring the result leads to incomplete or corrupted data.
    patterns:
      - pattern-either:
          - pattern: $S.Read($B, $O, $C);
          - pattern: await $S.ReadAsync($B, $O, $C, ...);
          - pattern: await $S.ReadAsync($B);
          - pattern: await $S.ReadAsync($B, $T);
      - pattern-not-inside: $V = $E;
      - pattern-not-inside: $TY $V = $E;
      - pattern-not-inside: var $V = $E;
