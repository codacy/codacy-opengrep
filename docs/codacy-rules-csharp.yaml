    languages:
      - csharp
    message: >-
      Make this field private and encapsulate it in a property.
      Fields are not part of a good public API: they cannot be versioned, validated or declared in interfaces.
    patterns:
      - pattern-either:
          - pattern-inside: |
              public class $C { ... public $T $F; ... }
          - pattern-inside: |
              public class $C { ... public $T $F = $V; ... }
      - pattern-not-inside: |
          public class $C { ... public static $T $F; ... }
      - pattern-not-inside: |
          public class $C { ... public static $T $F = $V; ... }
      - pattern-not-inside: |
          public class $C { ... public event $T $F; ... }
      - pattern-either:
          - pattern: public $T $F;
          - pattern: public $T $F = $V;
      - pattern-regex: '(?m)^[ \t]*(?![^\n]*\bconst\b)[^\n]*'
      - pattern-regex: '\bclass\b[^{;]*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\})*'
      - focus-metavariable: $F
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.optional-parameter
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use method overloading instead of this optional parameter.
      Default values are compiled into the calling code, so changing them later does not affect existing callers.
    patterns:
      - pattern-either:
          - pattern: |
              public $R $M(..., $T $P = $V, ...) { ... }
          - pattern: |
              protected $R $M(..., $T $P = $V, ...) { ... }
      - focus-metavariable: $P
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.performance.property-returns-collection-copy
    severity: WARNING
    languages:
      - csharp
    message: >-
      Refactor this property into a method, it creates a copy of a collection on each access.
      Callers expect property access to be cheap, so they may call it repeatedly, for example in a loop.
    pattern-regex: '[\w.<>\[\],?]+[ \t]+\K\w+(?=(?:\s*//[^\n]*)*\s*(?:\{\s*get\s*\{\s*return\b|\{\s*get\s*=>|=>)\s*[^;{}()]*(?:\([^()]*\))?\.(?:ToList|ToArray|Clone|ToDictionary|ToHashSet)\(\)\s*;)'
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.comprehensibility.multidimensional-array-parameter
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use a dedicated type instead of a multidimensional or jagged array parameter in this public method.
      Such parameters are hard to understand and to use correctly.
    pattern-regex: '\bpublic\b[^;{=()\n]*\((?:[^()]*,)?[ \t]*[\w.<>]+(?:\[\]\[\]|\[,+\])[\[\],]*[ \t]+\K\w+'
    metadata:
      category: comprehensibility
      confidence: HIGH
  - id: codacy.csharp.best-practice.property-getter-throws
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove this exception from the property getter, or turn the property into a method.
      Property getters are expected to be safe, simple operations.
    patterns:
      - pattern-either:
          - pattern: throw new $E(...);
          - pattern: throw new $E(...)
      - focus-metavariable: $E
      - metavariable-regex:
          metavariable: $E
          regex: '^(?!(?:System\.)?(?:NotImplementedException|NotSupportedException|InvalidOperationException|ObjectDisposedException)$)'
      - pattern-either:
          - pattern-regex: '\b\w+\s*\{\s*get\s*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\}'
          - pattern-regex: '\b\w+\s*\{\s*get\s*=>[^;]*;'
          - pattern-regex: '\b\w+[ \t]*=>[ \t]*throw\b[^;]*;'
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.write-only-property
    severity: INFO
    languages:
      - csharp
    message: >-
      Add a getter to this property, or replace it with a method.
      Properties that can be written but not read are counterintuitive.
    patterns:
      - pattern: |
          class $C { ... $T $P { set { ... } } ... }
      - focus-metavariable: $P
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.public-static-mutable-field
    severity: WARNING
    languages:
      - csharp
    message: >-
      Make this mutable static field private, or use an immutable or read-only collection type.
      Even a readonly field of a mutable type can be modified by any code that can access it.
    patterns:
      - pattern-either:
          - pattern: |
              class $C { ... public static $T $F; ... }
          - pattern: |
              class $C { ... public static $T $F = $V; ... }
      - metavariable-regex:
          metavariable: $T
          regex: '^(?:[\w.]+(?:<[^<>]*>)?\[\]|(?:System\.Collections\.Generic\.)?(?:List|Dictionary|HashSet|SortedSet|SortedList|SortedDictionary|LinkedList|Queue|Stack|ICollection|IList|IDictionary|ISet|Collection|ObservableCollection)(?:<.*>)?)$'
      - focus-metavariable: $F
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.field-shadows-parent-field
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this field, it hides a field of the parent class.
      A field with the same name as a base class field makes it unclear which one is used.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $P { ... $T $F; ... }
              ...
          - pattern-inside: |
              class $P { ... $T $F = $I; ... }
              ...
      - pattern-either:
          - pattern: |
              class $C : $P { ... $T2 $G; ... }
          - pattern: |
              class $C : $P { ... $T2 $G = $V; ... }
      - metavariable-comparison:
          comparison: str($F) == str($G)
      - focus-metavariable: $G
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.complexity.too-many-generic-parameters
    severity: WARNING
    languages:
      - csharp
    message: >-
      Reduce the number of generic parameters of this type or method.
      Types with more than 2 and methods with more than 3 generic parameters are hard to understand and to use.
    pattern-either:
      - pattern-regex: '\b(?:class|struct|interface|record)[ \t]+\K\w+(?=[ \t]*<[ \t]*\w+[ \t]*,[ \t]*\w+[ \t]*,[ \t]*\w+)'
      - pattern-regex: '(?m)^[ \t]*(?:(?:public|private|protected|internal|static|virtual|override|abstract|async|unsafe|new|sealed)[ \t]+)*(?!(?:return|else|new|await|throw|yield|case)\b)[\w.<>\[\],?]+[ \t]+\K\w+(?=[ \t]*<[ \t]*\w+[ \t]*,[ \t]*\w+[ \t]*,[ \t]*\w+[ \t]*,[ \t]*\w+[^<>]*>[ \t]*\()'
    metadata:
      category: complexity
      confidence: HIGH
  - id: codacy.csharp.codestyle.useless-bitwise-operation
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this bitwise operation, it does not change the value.
      Operations such as '& -1', '| 0' and '^ 0' always return the original operand.
    pattern-either:
      - pattern: $X & -1
      - pattern: -1 & $X
      - pattern: $X | 0
      - pattern: 0 | $X
      - pattern: $X ^ 0
      - pattern: 0 ^ $X
      - pattern: $X &= -1
      - pattern: $X |= 0
      - pattern: $X ^= 0
    options:
      constant_propagation: false
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.codestyle.control-character-in-string
    severity: INFO
    languages:
      - csharp
    message: >-
      Replace this invisible or control character in the string literal with an escape sequence.
      Raw tabs and other control characters are invisible in most editors and easily lost.
    pattern-regex: '(?<![@\w])(?<!\$@)(?<!@\$)\$?"(?:[^"\\\n]|\\.)*?\K[\x00-\x08\x09\x0B\x0C\x0E-\x1F](?=(?:[^"\\\n]|\\.)*")'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.security.empty-generic-catch
    severity: ERROR
    languages:
      - csharp
    message: >-
      Handle this exception, or explain in a comment why it can be ignored.
      Silently swallowing all exceptions hides failures, including security-relevant ones.
    pattern-regex: '\b\Kcatch\b(?:[ \t]*\([ \t]*(?:System\.)?Exception(?:[ \t]+\w+)?[ \t]*\))?(?:\s*//[^\n]*)*\s*\{\s*\}'
    metadata:
      category: security
      cwe: "CWE-390: Detection of Error Condition Without Action"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      confidence: HIGH
  - id: codacy.csharp.performance.non-constant-log-template
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use a constant message template and pass the values as arguments to this logging call.
      Interpolated or concatenated templates are built even when the log level is disabled and break structured logging.
    patterns:
      - pattern-either:
          - pattern: $L.$LOG($"...", ...)
          - pattern: $L.$LOG($EX, $"...", ...)
          - pattern: $L.$LOG("$S" + $X, ...)
          - pattern: $L.$LOG($X + "$S", ...)
          - pattern: $L.$LOG($EX, "$S" + $X, ...)
          - pattern: $L.$LOG(string.Format(...), ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: '^(?:Log(?:Trace|Debug|Information|Warning|Error|Critical)?|Trace|Debug|Info|Information|Warn|Warning|Error|Fatal|Verbose|DebugFormat|InfoFormat|WarnFormat|ErrorFormat|FatalFormat)$'
      - metavariable-regex:
          metavariable: $L
          regex: '(?i).*log.*'
    metadata:
      category: performance
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.boolean-literal-in-assertion
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use the dedicated boolean assertion instead of comparing with a boolean literal.
      Assert.IsTrue or Assert.IsFalse express the intent better and produce clearer failure messages.
    pattern-either:
      - pattern: Assert.AreEqual(true, ...)
      - pattern: Assert.AreEqual(false, ...)
      - pattern: Assert.AreEqual($X, true, ...)
      - pattern: Assert.AreEqual($X, false, ...)
      - pattern: Assert.AreNotEqual(true, ...)
      - pattern: Assert.AreNotEqual(false, ...)
      - pattern: Assert.Equal(true, ...)
      - pattern: Assert.Equal(false, ...)
      - pattern: Assert.NotEqual(true, ...)
      - pattern: Assert.NotEqual(false, ...)
      - pattern: Assert.IsTrue(true, ...)
      - pattern: Assert.IsTrue(false, ...)
      - pattern: Assert.IsFalse(true, ...)
      - pattern: Assert.IsFalse(false, ...)
      - pattern: Assert.That($X, Is.EqualTo(true))
      - pattern: Assert.That($X, Is.EqualTo(false))
    options:
      constant_propagation: false
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.catch-only-rethrows
    severity: INFO
    languages:
      - csharp
    message: >-
      Add logic to this catch clause or remove it, it only rethrows the exception.
      A catch clause that only rethrows has no effect.
    pattern-regex: '\b\Kcatch\b(?:[ \t]*\([^()]*\))?(?:\s*//[^\n]*)*\s*\{\s*throw[ \t]*;\s*\}(?!\s*catch\b)'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.thread-sleep-in-test
    severity: WARNING
    languages:
      - csharp
    message: >-
      Do not use Thread.Sleep in this test, wait for a specific condition instead.
      Sleeping makes tests slow and flaky, because the right duration depends on the machine.
    patterns:
      - pattern-either:
          - pattern: Thread.Sleep(...)
          - pattern: System.Threading.Thread.Sleep(...)
      - pattern-either:
          - pattern-inside: |
              [TestMethod]
              $R $M(...) { ... }
          - pattern-inside: |
              [DataTestMethod]
              $R $M(...) { ... }
          - pattern-inside: |
              [Test]
              $R $M(...) { ... }
          - pattern-inside: |
              [TestCase(...)]
              $R $M(...) { ... }
          - pattern-inside: |
              [Fact]
              $R $M(...) { ... }
          - pattern-inside: |
              [Theory]
              $R $M(...) { ... }
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.field-could-be-readonly
    severity: INFO
    languages:
      - csharp
    message: >-
      Make this field 'readonly', it is only assigned in its declaration or in constructors.
      Readonly fields document that the value does not change after construction and prevent accidental modification.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  class $C { ... }
              - pattern: private $T $F = $V;
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      class $C { ... $C(...) { ... $F = $X; ... } ... }
                  - pattern-inside: |
                      class $C { ... $C(...) { ... this.$F = $X; ... } ... }
                  - pattern-inside: |
                      class $C { ... $C(...) => this.$F = $X; ... }
                  - pattern-inside: |
                      class $C { ... $C(...) => $F = $X; ... }
              - pattern: private $T $F;
      - pattern-not-inside: |
          $R $METH(...) { ... }
      - pattern-not-inside: |
          class $C { ... static $T $F; ... }
      - pattern-not-inside: |
          class $C { ... static $T $F = $V; ... }
      - pattern-not-inside: |
          class $C { ... readonly $T $F; ... }
      - pattern-not-inside: |
          class $C { ... readonly $T $F = $V; ... }
      - pattern-not-inside: |
          class $C { ... const $T $F = $V; ... }
      - pattern-not-inside: |
          class $C { ... [$ANNO] private $T $F; ... }
      - pattern-not-inside: |
          class $C { ... [$ANNO] private $T $F = $V; ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... $F = $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... this.$F = $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... <... $F++ ...>; ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... <... $F-- ...>; ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... $F += $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... $F -= $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... $FN(..., $F, ...); ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... $O.$FN(..., $F, ...); ... } ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P { get { ... } set { ... $F = $X; ... } } ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P { get => $G; set => $F = $X; } ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P => <... $F = $X ...>; ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P => <... $F ??= $X ...>; ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P { get { ... $F = $X; ... } } ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P { get { ... $F = $X; ... } set { ... } } ... }
      - pattern-not-inside: |
          class $C { ... $R $MM(...) { ... $F ??= $X; ... } ... }
    metadata:
      category: best-practice
      confidence: LOW
  - id: codacy.csharp.codestyle.simplify-linq-expression
    severity: INFO
    languages:
      - csharp
    message: >-
      Simplify this LINQ expression.
      A Where followed by a predicate-less call, or a cast and filter pair, can be written as a single call such as Any(predicate) or OfType<T>().
    pattern-either:
      - patterns:
          - pattern: $S.Where($P).$M()
          - metavariable-regex:
              metavariable: $M
              regex: '^(?:Any|Count|LongCount|First|FirstOrDefault|Last|LastOrDefault|Single|SingleOrDefault)$'
      - pattern: $S.Select($X => $X as $T).Where($Y => $Y != null)
      - pattern: $S.Select($X => $X as $T).Any($Y => $Y != null)
      - pattern: $S.Where($X => $X is $T).Select($Y => ($T)$Y)
      - pattern: $S.Where($X => $X is $T).Cast<$T>()
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.best-practice.reflection-accessibility-bypass
    severity: ERROR
    languages:
      - csharp
    message: >-
      Make sure that using reflection to access non-public members is safe here.
      Bypassing accessibility breaks encapsulation and can expose functionality that was meant to be internal.
    pattern-either:
      - pattern: BindingFlags.NonPublic
      - pattern: System.Reflection.BindingFlags.NonPublic
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.member-more-visible-than-type
    severity: WARNING
    languages:
      - csharp
    message: >-
      Reduce the accessibility of this member to match the accessibility of its containing type.
      A public member of an internal type is not really public, which is misleading.
    patterns:
      - pattern-either:
          - pattern: |
              internal class $C { ... public $R $M(...) { ... } ... }
          - pattern: |
              internal class $C { ... public $T $M; ... }
          - pattern: |
              internal class $C { ... public $T $M = $V; ... }
          - pattern: |
              internal class $C { ... public static $T $M = $V; ... }
      - pattern-not: |
          internal class $C { ... public override $R $M(...) { ... } ... }
      - pattern-not: |
          internal class $C : $B { ... }
      - pattern-not: |
          internal class $C : $B, $I { ... }
      - pattern-not: |
          internal class $C : $B, $I, $J { ... }
      - focus-metavariable: $M
    metadata:
      category: best-practice
      confidence: LOW
  - id: codacy.csharp.best-practice.type-check-on-this
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use polymorphism instead of testing the type of 'this'.
      A base class that checks which subclass it is couples it to its subclasses.
    pattern-either:
      - pattern: this is $T
      - pattern: this as $T
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.performance.stringbuilder-never-read
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove this StringBuilder or use its result.
      Building a string that is never read wastes memory and processing time.
    patterns:
      - pattern-either:
          - pattern: var $SB = new StringBuilder(...);
          - pattern: StringBuilder $SB = new StringBuilder(...);
          - pattern: var $SB = new System.Text.StringBuilder(...);
      - pattern-inside: |
          $R $METH(...) { ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $SB.ToString(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... return <... $SB ...>; ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $F(..., $SB, ...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $O.$F(..., $SB, ...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $SB.CopyTo(...); ... }
      - pattern-not-inside: |
          $R $METH(...) { ... <... $SB.Length ...>; ... }
      - pattern-not-inside: |
          $R $METH(...) { ... <... $SB[$I] ...>; ... }
      - pattern-not-inside: |
          $R $METH(...) { ... $Y = $SB; ... }
      - pattern-not-regex: '\b(?:if|while|return)\b[^;{]*\.Length'
      - focus-metavariable: $SB
    metadata:
      category: performance
      confidence: MEDIUM
  - id: codacy.csharp.performance.multiple-orderby-calls
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use ThenBy() instead of this second OrderBy() call.
      A second OrderBy discards the previous ordering, so only the last one is applied while both are computed.
    pattern-either:
      - pattern: $X.OrderBy(...).OrderBy(...)
      - pattern: $X.OrderBy(...).OrderByDescending(...)
      - pattern: $X.OrderByDescending(...).OrderBy(...)
      - pattern: $X.OrderByDescending(...).OrderByDescending(...)
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.performance.missing-configure-await
    severity: ERROR
    languages:
      - csharp
    message: >-
      Add '.ConfigureAwait(false)' to this awaited task in library code.
      Capturing the synchronization context is unnecessary in libraries, costs performance and can cause deadlocks.
    patterns:
      - pattern: await $E
      - pattern-not: await $X.ConfigureAwait(...)
      - pattern-not: await Task.Yield()
    metadata:
      category: performance
      confidence: LOW
  - id: codacy.csharp.best-practice.nested-member-shadows-outer-member
    severity: INFO
    languages:
      - csharp
    message: >-
      Rename this member, it hides a static member of the outer class.
      Members of nested classes with the same names as static members of the outer class make it unclear which one is used.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $O { ... static $T $A; ... }
          - pattern-inside: |
              class $O { ... static $T $A = $V; ... }
          - pattern-inside: |
              class $O { ... static $T $A(...) { ... } ... }
      - pattern-inside: |
          class $O { ... class $I { ... } ... }
      - pattern-inside: |
          class $I { ... }
      - pattern-either:
          - pattern: $T2 $B;
          - pattern: $T2 $B = $V2;
          - pattern: |
              $T2 $B(...) { ... }
      - metavariable-comparison:
          comparison: str($A) == str($B)
      - focus-metavariable: $B
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.suppress-finalize-without-finalizer
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this call to GC.SuppressFinalize, this sealed type has no finalizer.
      Suppressing finalization only makes sense for types that declare a finalizer, directly or in a derived type.
    patterns:
      - pattern: GC.SuppressFinalize(this)
      - pattern-regex: '\bsealed\b[^{;]*?\bclass[ \t]+(\w+)\b[^{]*\{(?:(?!~\1[ \t]*\()[^{}]|\{(?:(?!~\1[ \t]*\()[^{}]|\{(?:(?!~\1[ \t]*\()[^{}]|\{(?:(?!~\1[ \t]*\()[^{}])*\})*\})*\})*\}'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.performance.duplicate-cast
    severity: INFO
    languages:
      - csharp
    message: >-
      Use pattern matching ('is T t') instead of checking the type and casting it again.
      Testing the type and then casting the same value performs the type check twice.
    patterns:
      - pattern-either:
          - pattern: ($T)$X
          - pattern: $X as $T
      - pattern-inside: if ($X is $T) $S;
      - pattern-not-inside: $X is $T
    options:
      constant_propagation: false
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.codestyle.default-value-passed-explicitly
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this argument, it is the default value of the parameter.
      Passing the default value explicitly is redundant and hides which arguments really matter.
    pattern-either:
      - patterns:
          - pattern-inside: |
              class $C { ... $R $M($T1 $A, $T2 $B = $V) { ... } ... }
          - pattern: $M($X, $V)
          - focus-metavariable: $V
      - patterns:
          - pattern-inside: |
              class $C { ... $R $M($T1 $A, $T2 $B, $T3 $D = $V) { ... } ... }
          - pattern: $M($X, $Y, $V)
          - focus-metavariable: $V
      - patterns:
          - pattern-inside: |
              class $C { ... $R $M($T1 $A, $T2 $B = $V, $T3 $D = $W) { ... } ... }
          - pattern: $M($X, $V)
          - focus-metavariable: $V
    options:
      constant_propagation: false
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.performance.use-string-isnullorempty
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use string.IsNullOrEmpty() to test whether this string is empty.
      It expresses the intent better and also handles null values.
    pattern-either:
      - pattern: $S.Equals("")
      - pattern: '"".Equals($S)'
      - pattern: string.Equals($S, "")
      - pattern: string.Equals("", $S)
      - pattern: $S.Equals(string.Empty)
      - pattern: string.Empty.Equals($S)
      - pattern: (string $S).Length == 0
      - pattern: (string $S).Length != 0
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.performance.private-class-not-sealed
    severity: ERROR
    languages:
      - csharp
    message: >-
      Seal this private class, it is never inherited.
      Sealing classes that are not designed for inheritance lets the runtime optimize calls and documents the intent.
    pattern-regex: '\b(?:private|file)[ \t]+(?:(?:partial|new|unsafe|internal|protected)[ \t]+)*(?:class|record)[ \t]+\K(\w+)\b(?![\s\S]*?(?::|,)[ \t]*\1\b)'
    metadata:
      category: performance
      confidence: MEDIUM
  - id: codacy.csharp.codestyle.empty-namespace
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this empty namespace.
      An empty namespace declaration adds nothing.
    pattern-regex: '\bnamespace[ \t]+[\w.]+(?:\s*//[^\n]*)*\s*\{\s*\}'
    metadata:
      category: codestyle
      confidence: HIGH
  - id: codacy.csharp.unused-code.event-never-raised
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this event or raise it somewhere.
      An event that is never invoked misleads subscribers into waiting for notifications that never come.
    pattern-regex: '\bevent[ \t]+[\w.<>,? ]+?[ \t]+\K(\w+)(?=[ \t]*;)(?![\s\S]*\b\1[ \t]*(?:\?\.Invoke|\.Invoke|\(|\)))(?![\s\S]*=[ \t]*\1[ \t]*;)'
    metadata:
      category: unused-code
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.bitwise-operation-on-non-flags-enum
    severity: WARNING
    languages:
      - csharp
    message: >-
      Add the [Flags] attribute to this enumeration, or do not combine its values with bitwise operators.
      Combining members of an enumeration that is not meant to hold flags produces values that may not exist.
    patterns:
      - pattern-either:
          - pattern: $E.$A | $E.$B
          - pattern: $E.$A & $E.$B
          - pattern: $E.$A ^ $E.$B
      - pattern-inside: |
          enum $E { ... }
          ...
      - pattern-not-inside: |
          [Flags]
          enum $E { ... }
          ...
      - pattern-not-inside: |
          [System.Flags]
          enum $E { ... }
          ...
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.loop-could-use-linq
    severity: INFO
    languages:
      - csharp
    message: >-
      Use a LINQ Where clause instead of filtering inside this loop.
      A loop whose body only consists of a condition can be written more clearly with LINQ.
    patterns:
      - pattern-either:
          - pattern: |
              foreach (var $X in $C) { if ($P) $S; }
          - pattern: |
              foreach ($T $X in $C) { if ($P) $S; }
      - pattern-not: |
          foreach (var $X in $C) { if ($P) $S; else $E; }
      - pattern-not: |
          foreach ($T $X in $C) { if ($P) $S; else $E; }
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.caller-information-parameter-not-last
    severity: WARNING
    languages:
      - csharp
    message: >-
      Move this caller information parameter to the end of the parameter list.
      Caller information parameters are optional and filled by the compiler, so they belong after all other parameters.
    pattern-regex: '\[[ \t]*(?:System\.Runtime\.CompilerServices\.)?Caller(?:FilePath|LineNumber|MemberName|ArgumentExpression)(?:Attribute)?\b[^\]]*\]\s*[\w.<>\[\]?]+[ \t]+\K\w+(?=[ \t]*(?:=[^,()]*)?,(?!\s*\[[ \t]*(?:System\.Runtime\.CompilerServices\.)?Caller)[^()]*\))'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.local-could-be-const
    severity: WARNING
    languages:
      - csharp
    message: >-
      Declare this local variable as 'const', its value never changes.
      Constants make it clear that the value is fixed and let the compiler inline it.
    patterns:
      - pattern-inside: |
          $R $METH(...) { ... }
      - pattern-regex: '(?m)^[ \t]*(?:var|int|long|short|byte|uint|ulong|double|float|decimal|bool|char|string)[ \t]+\K(\w+)(?=[ \t]*=[ \t]*(?:-?\d[\w.]*|@?"(?:[^"\\\n]|\\.)*"|''(?:[^''\\]|\\.)+''|true|false)[ \t]*;(?:(?!\b\1[ \t]*(?:=[^=]|\+\+|--|[-+*/%&|^]=|<<=|>>=|\?\?=)|(?:\+\+|--|\bref[ \t]+|\bout[ \t]+)\1\b)[^{}]|\{(?:(?!\b\1[ \t]*(?:=[^=]|\+\+|--|[-+*/%&|^]=|<<=|>>=|\?\?=)|(?:\+\+|--|\bref[ \t]+|\bout[ \t]+)\1\b)[^{}]|\{(?:(?!\b\1[ \t]*(?:=[^=]|\+\+|--|[-+*/%&|^]=|<<=|>>=|\?\?=)|(?:\+\+|--|\bref[ \t]+|\bout[ \t]+)\1\b)[^{}])*\})*\})*\})'
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.comprehensibility.nested-ternary
    severity: INFO
    languages:
      - csharp
    message: >-
      Extract this nested conditional expression into an independent statement.
      Nested ternary operators are hard to read.
    pattern-either:
      - pattern: "$A ? $B : $C ? $D : $E"
      - pattern: "$A ? ($B ? $C : $D) : $E"
      - pattern: "($A ? $B : $C) ? $D : $E"
    metadata:
      category: comprehensibility
      confidence: HIGH
  - id: codacy.csharp.performance.method-returns-constant
    severity: INFO
    languages:
      - csharp
    message: >-
      Replace this method with a constant, it always returns the same value.
      A method that only returns a literal is slower and less clear than a constant.
    patterns:
      - pattern-either:
          - pattern: |
              $R $M() { return $L; }
          - pattern: |
              $R $M() => $L;
      - metavariable-regex:
          metavariable: $L
          regex: '^(?:-?\d[\w.]*|@?"(?:[^"\\]|\\.)*"|''(?:[^''\\]|\\.)+''|true|false)$'
      - pattern-not: |
          override $R $M() { ... }
      - pattern-not: |
          virtual $R $M() { ... }
      - pattern-not: |
          override $R $M() => $L;
      - pattern-not: |
          virtual $R $M() => $L;
      - focus-metavariable: $M
    options:
      constant_propagation: false
    metadata:
      category: performance
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.logger-category-mismatch
    severity: WARNING
    languages:
      - csharp
    message: >-
      Name this logger after the enclosing type.
      A logger named after another type makes log entries hard to attribute and filter.
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern-either:
          - pattern: $F.CreateLogger<$T>()
          - pattern: $F.CreateLogger(typeof($T))
          - pattern: $F.CreateLogger(nameof($T))
          - pattern: LogManager.GetLogger(typeof($T))
          - pattern: LogManager.GetCurrentClassLogger(typeof($T))
      - metavariable-comparison:
          comparison: str($T) != str($C)
      - pattern-not-inside: |
          class $C { ... class $N { ... } ... }
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.overlapping-overload-defaults
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove the default values of this overload, or rename one of the methods.
      Calls that omit the optional arguments resolve to the other overload, so the default values are never used.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  class $C { ... $R $M($T $A) { ... } ... }
              - pattern: |
                  $R2 $M($T2 $A2, $U $B = $V) { ... }
              - metavariable-comparison:
                  comparison: str($T) == str($T2)
          - patterns:
              - pattern-inside: |
                  class $C { ... $R $M() { ... } ... }
              - pattern: |
                  $R2 $M($U $B = $V) { ... }
      - focus-metavariable: $M
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.expected-exception-attribute
    severity: WARNING
    languages:
      - csharp
    message: >-
      Replace the ExpectedException attribute with an explicit assertion such as Assert.ThrowsException.
      The attribute passes when any line of the test throws, not only the one that should.
    pattern-regex: '\[[ \t]*\KExpectedException(?:Attribute)?\b(?=[^\]]*\](?:\s*//[^\n]*)*\s*(?:\[[^\]]*\](?:\s*//[^\n]*)*\s*)*(?:(?:public|private|internal|async|static)[ \t]+)*[\w.<>]+[ \t]+\w+[ \t]*\([^)]*\)\s*\{(?![^;{}]*;\s*\}))'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.performance.check-before-assign
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this redundant check and assign the value directly.
      Checking whether a variable already holds the value before assigning it adds a condition without benefit.
    patterns:
      - pattern-either:
          - pattern: |
              if ($X != $A) { $X = $A; }
          - pattern: |
              if ($A != $X) { $X = $A; }
      - pattern-not: |
          if ($X != $A) { $X = $A; } else $E;
      - metavariable-regex:
          metavariable: $X
          regex: '^[a-z_]\w*$'
    options:
      constant_propagation: false
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.best-practice.public-constructor-in-abstract-class
    severity: INFO
    languages:
      - csharp
    message: >-
      Make this constructor protected, its class is abstract.
      Abstract classes cannot be instantiated, so a public constructor is misleading.
    patterns:
      - pattern-inside: |
          abstract class $C { ... }
      - pattern-regex: '\b(?:public|internal)[ \t]+\K(\w+)(?=[ \t]*\((?:[^()]|\([^()]*\))*\)(?:\s*//[^\n]*)*\s*(?::\s*(?:base|this)\s*\((?:[^()]|\([^()]*\))*\)\s*)?\{)'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.default-parameter-value-without-optional
    severity: WARNING
    languages:
      - csharp
    message: >-
      Add the [Optional] attribute to this parameter.
      Without it, [DefaultParameterValue] has no effect and callers must still pass a value.
    pattern-regex: '[(,]\s*(?=(?:\[[^\]]*\]\s*)*\[[^\]]*\bDefaultParameterValue\b)(?!(?:\[[^\]]*\]\s*)*\[[^\]]*\bOptional\b)(?:\[[^\]]*\]\s*)+[\w.<>\[\]?]+[ \t]+\K\w+'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.performance.redundant-tochararray
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this ToCharArray() call, strings can be indexed and enumerated directly.
      Copying the string into a new array is unnecessary.
    pattern-either:
      - pattern: foreach (var $C in $S.ToCharArray()) $B
      - pattern: foreach ($T $C in $S.ToCharArray()) $B
      - pattern: $S.ToCharArray()[$I]
      - pattern: $S.ToCharArray().Length
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.correctness.format-string-unused-arguments
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use all the arguments passed to this composite format string, or remove the unused ones.
      An argument without a matching format item is silently ignored, which usually indicates a mistake.
    patterns:
      - pattern-either:
          - pattern: string.Format("$F", ...)
          - pattern: String.Format("$F", ...)
          - pattern: $SB.AppendFormat("$F", ...)
          - pattern: Console.WriteLine("$F", ...)
          - pattern: Console.Write("$F", ...)
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $O.$M("$F", $A1)
              - metavariable-regex:
                  metavariable: $F
                  regex: '^(?!(?s:.*)(?<!\{)\{\s*0\s*[,:}])'
          - patterns:
              - pattern-either:
                  - pattern: $O.$M("$F", $A1, $A2)
              - metavariable-regex:
                  metavariable: $F
                  regex: '^(?!(?s:.*)(?<!\{)\{\s*0\s*[,:}](?s:.*)(?<!\{)\{\s*1\s*[,:}])(?!(?s:.*)(?<!\{)\{\s*1\s*[,:}](?s:.*)(?<!\{)\{\s*0\s*[,:}])'
          - patterns:
              - pattern-either:
                  - pattern: $O.$M("$F", $A1, $A2, $A3)
              - metavariable-regex:
                  metavariable: $F
                  regex: '^(?=(?s:.*)(?<!\{)\{\s*[0-2]\s*[,:}])(?!(?=(?s:.*)(?<!\{)\{\s*0\s*[,:}])(?=(?s:.*)(?<!\{)\{\s*1\s*[,:}])(?=(?s:.*)(?<!\{)\{\s*2\s*[,:}]))'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.best-practice.unassigned-field
    severity: WARNING
    languages:
      - csharp
    message: >-
      Assign this field or remove it, it always holds its default value.
      A field that is read but never written is either useless or a sign of missing initialization.
    patterns:
      - pattern-inside: |
          class $C { ... }
      - pattern: private $T $F;
      - pattern-not-inside: |
          $R $METH(...) { ... }
      - pattern-not-inside: |
          class $C { ... $R $M(...) { ... $F = $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $M(...) { ... this.$F = $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $C(...) { ... $F = $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $C(...) { ... this.$F = $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $C(...) => this.$F = $X; ... }
      - pattern-not-inside: |
          class $C { ... $C(...) => $F = $X; ... }
      - pattern-not-inside: |
          class $C { ... $R $M(...) { ... $FN(..., $F, ...); ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $M(...) { ... $O.$FN(..., $F, ...); ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $M(...) { ... <... $F++ ...>; ... } ... }
      - pattern-not-inside: |
          class $C { ... $R $M(...) { ... $F += $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P { get { ... } set { ... $F = $X; ... } } ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P { get => $G; set => $F = $X; } ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P => <... $F = $X ...>; ... }
      - pattern-not-inside: |
          class $C { ... $T2 $P => <... $F ??= $X ...>; ... }
      - pattern-not-inside: |
          class $C { ... $R $M(...) { ... $F ??= $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... [$ANNO] private $T $F; ... }
      - pattern-regex: '\bclass\b[^{;]*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*\})*'
    metadata:
      category: best-practice
      confidence: LOW
  - id: codacy.csharp.codestyle.redundant-member-initializer
    severity: INFO
    languages:
      - csharp
    message: >-
      Remove this initializer, the constructor always overwrites it.
      An initial value that is replaced before it can be used is dead code.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C { ... $C(...) { $F = $X; ... } ... }
          - pattern-inside: |
              class $C { ... $C(...) { this.$F = $X; ... } ... }
      - pattern-not-inside: |
          class $C { ... $C(...) { ... } ... $C(...) { ... } ... }
      - pattern: $T $F = $V;
      - pattern-not-inside: |
          $R $METH(...) { ... }
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.non-public-exception-type
    severity: WARNING
    languages:
      - csharp
    message: >-
      Make this exception type public.
      Callers outside the assembly cannot catch a non-public exception specifically and have to catch a base type instead.
    pattern-regex: '(?m)^[ \t]*(?![^\n]*\bpublic\b)(?:(?:internal|private|protected|sealed|abstract|partial)[ \t]+)*class[ \t]+\K\w+(?=[^{;]*:[ \t]*(?:[\w.]+\.)?\w*Exception\b)'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.out-or-ref-parameter
    severity: WARNING
    languages:
      - csharp
    message: >-
      Return values instead of using 'out' or 'ref' parameters in this public method.
      Out and ref parameters are harder to use and to understand than return values.
    pattern-regex: '(?m)^[ \t]*public\b(?![^\n]*\b(?:override|Deconstruct)\b)(?![^\n]*\bbool[ \t]+Try\w*[ \t]*(?:<[^>]*>)?[ \t]*\()[^;{=()\n]*?[ \t]\K\w+(?=[ \t]*(?:<[^<>()]*>)?[ \t]*\([^()]*\b(?:ref|out)[ \t]+[^()]*\))'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.equality-operator-on-reference-type
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove this overload of operator==, it changes the meaning of '==' for a reference type.
      Callers expect '==' on reference types to compare references, so overloading it is confusing.
    pattern-regex: '\bclass[ \t]+\K\w+(?![^{;]*\bI(?:Comparable|Equatable)\b)(?=[^{;]*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*?\boperator[ \t]*==)(?![^{;]*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*?\boperator[ \t]*[+-][ \t]*\()'
    metadata:
      category: best-practice
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.non-integral-indexer
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use a string or an integral type as the parameter of this indexer.
      Indexers are expected to look up elements by position or by key.
    pattern-regex: '\bthis[ \t]*\[[ \t]*\K(?!(?:string|String|int|Int32|long|Int64|short|Int16|uint|UInt32|ulong|UInt64|ushort|UInt16|byte|Byte|sbyte|SByte|char|Char|object|Object|Index|Range|T\w*)\b)[\w.<>?]+(?=[ \t]+\w+[ \t]*\])'
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.codestyle.array-created-for-params
    severity: INFO
    languages:
      - csharp
    message: >-
      Pass the elements directly instead of creating an array for this 'params' parameter.
      The compiler creates the array automatically.
    pattern-either:
      - patterns:
          - pattern-regex: '\b(\w+)[ \t]*\([^()]*\bparams\b[^()]*\)[\s\S]*?\b\1[ \t]*\((?:[^()]*,)?[ \t]*\Knew[ \t]*(?:[\w.<>]+)?[ \t]*\[[ \t]*\][ \t]*\{[^{}]*\}(?=[ \t]*\))'
      - patterns:
          - pattern-regex: '\b(\w+)[ \t]*\((?:[^()]*,)?[ \t]*\Knew[ \t]*(?:[\w.<>]+)?[ \t]*\[[ \t]*\][ \t]*\{[^{}]*\}(?=[ \t]*\))(?=[\s\S]*\b\1[ \t]*\([^()]*\bparams\b)'
    metadata:
      category: codestyle
      confidence: MEDIUM
  - id: codacy.csharp.performance.empty-finalizer
    severity: WARNING
    languages:
      - csharp
    message: >-
      Remove this empty finalizer.
      An empty finalizer still forces the garbage collector to keep the object alive for an extra cycle.
    pattern-regex: '~\w+[ \t]*\([ \t]*\)(?:\s*//[^\n]*)*\s*\{\s*\}'
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.correctness.incorrect-idisposable-implementation
    severity: ERROR
    languages:
      - csharp
    message: >-
      Implement the dispose pattern: seal this class or provide a protected virtual Dispose(bool) method.
      Derived classes need Dispose(bool) to release their own resources correctly.
    pattern-regex: '(?m)^[ \t]*(?![^\n]*\bsealed\b)[^\n]*?\bclass[ \t]+\K\w+\b(?=[^{;]*:[^{;]*\bIDisposable\b)(?![^{;]*\{(?:[^{}]|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\})*?\bvoid[ \t]+Dispose[ \t]*\([ \t]*bool\b)'
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.best-practice.readonly-mutable-field
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use an immutable collection type for this field, or make it private.
      'readonly' only prevents reassigning the field, the referenced array or collection can still be modified.
    patterns:
      - pattern-either:
          - pattern: |
              class $C { ... public readonly $T $F; ... }
          - pattern: |
              class $C { ... public readonly $T $F = $V; ... }
          - pattern: |
              class $C { ... protected readonly $T $F; ... }
          - pattern: |
              class $C { ... protected readonly $T $F = $V; ... }
          - pattern: |
              class $C { ... internal readonly $T $F; ... }
          - pattern: |
              class $C { ... internal readonly $T $F = $V; ... }
      - metavariable-regex:
          metavariable: $T
          regex: '^(?:[\w.]+(?:<[^<>]*>)?\[\]|(?:System\.Collections\.Generic\.)?(?:List|Dictionary|HashSet|SortedSet|SortedList|SortedDictionary|LinkedList|Queue|Stack|Collection|ObservableCollection)(?:<.*>)?)$'
      - focus-metavariable: $F
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.best-practice.equals-without-iequatable
    severity: INFO
    languages:
      - csharp
    message: >-
      Implement IEquatable<T> in this type, it already provides Equals(T).
      Implementing the interface lets generic collections use the strongly typed method.
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $C { ... bool Equals($C $O) { ... } ... }
          - pattern-inside: |
              class $C { ... bool Equals($C $O) => $E; ... }
      - pattern-regex: '\b(?:class|struct)[ \t]+\K(?<CLS>\w+)(?![^{;]*\bIEquatable\b)'
      - metavariable-comparison:
          comparison: str($CLS) == str($C)
    metadata:
      category: best-practice
      confidence: HIGH
  - id: codacy.csharp.performance.struct-without-iequatable
    severity: WARNING
    languages:
      - csharp
    message: >-
      Implement IEquatable<T> in this struct.
      Without it, equality comparisons box the struct and use slow reflection-based field comparison.
    pattern-regex: '(?m)^[ \t]*(?![^\n]*\bref[ \t]+struct\b)(?:(?:public|private|protected|internal|readonly|partial|record)[ \t]+)*struct[ \t]+\K\w+(?![^{;]*\bIEquatable\b)(?=[^{;]*\{)'
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.performance.get-executing-assembly
    severity: WARNING
    languages:
      - csharp
    message: >-
      Use typeof(SomeType).Assembly instead of Assembly.GetExecutingAssembly().
      GetExecutingAssembly walks the call stack, which is much slower.
    pattern-either:
      - pattern: Assembly.GetExecutingAssembly()
      - pattern: System.Reflection.Assembly.GetExecutingAssembly()
    metadata:
      category: performance
      confidence: HIGH
  - id: codacy.csharp.best-practice.type-outside-namespace
    severity: INFO
    languages:
      - csharp
    message: >-
      Move this type into a named namespace.
