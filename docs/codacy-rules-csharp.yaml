      implicit_deep_exprstmt: false
    metadata:
      category: correctness
      confidence: MEDIUM
  - id: codacy.csharp.correctness.nan-comparison
    severity: ERROR
    languages:
      - csharp
    message: >-
      Use double.IsNaN() or float.IsNaN() instead of comparing with NaN.
      NaN is not equal to anything, not even itself, so this comparison always gives the same result.
    patterns:
      - pattern-either:
          - pattern: $X == $NAN
          - pattern: $X != $NAN
          - pattern: $X < $NAN
          - pattern: $X <= $NAN
          - pattern: $X > $NAN
          - pattern: $X >= $NAN
          - pattern: $NAN == $X
          - pattern: $NAN != $X
      - metavariable-regex:
          metavariable: $NAN
          regex: '^(?:System\.)?(?:double|float|Double|Single)\.NaN$'
