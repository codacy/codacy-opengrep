              - pattern-inside: |
                  using ($T $X = $E) { ... }
      - pattern-regex: '\busing[ \t]+(?:var|[\w.<>]+)[ \t]+(\w+)[ \t]*=[^;]*;(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?\K\breturn[ \t]+\1[ \t]*;'
    metadata:
      category: correctness
      confidence: HIGH
  - id: codacy.csharp.correctness.threadstatic-on-instance-field
    severity: ERROR
    languages:
      - csharp
    message: >-
      Make this [ThreadStatic] field static, or remove the attribute.
      The ThreadStatic attribute is ignored on instance fields.
