      category: correctness
      cwe: "CWE-459: Incomplete Cleanup"
      confidence: LOW
  - id: codacy.csharp.correctness.class-owns-disposable-fields
    severity: ERROR
    languages:
      - csharp
    message: >-
      Implement IDisposable in this class and dispose the disposable fields it creates.
      A class that creates disposable members owns them and must offer a way to release their resources.
    patterns:
      - pattern-either:
          - pattern: |
              class $C { ... $T $F = new $D(...); ... }
          - pattern: |
              class $C { ... $R $M(...) { ... $F = new $D(...); ... } ... }
          - pattern: |
              class $C { ... $C(...) { ... $F = new $D(...); ... } ... }
      - metavariable-regex:
          metavariable: $D
          regex: '^(?:System\.IO\.)?(?:FileStream|StreamReader|StreamWriter|BinaryReader|BinaryWriter|Bitmap|WebClient|TcpClient|UdpClient|Socket|CancellationTokenSource|SqlConnection|SqlCommand|Mutex|Semaphore|SemaphoreSlim|Timer|MemoryStream)$'
