rules:
  - id: codacy.java.i18n.enforce-localized-output
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern-either:
          # Detect direct string literals
          - pattern: System.out.println("...");
          - pattern: System.out.print("...");
          - pattern: System.err.println("...");
          - pattern: System.err.print("...");
          # Detect string concatenation
          - pattern: System.out.println($X + ...);
          - pattern: System.out.print($X + ...);
          - pattern: System.err.println($X + ...);
          - pattern: System.err.print($X + ...);
          # Detect String.format without ResourceBundle
          - pattern: System.out.println(String.format(...));
          - pattern: System.out.print(String.format(...));
      - pattern-not: System.out.println($BUNDLE.getString(...))
      - pattern-not: System.out.print($BUNDLE.getString(...))
      - pattern-not: System.err.println($BUNDLE.getString(...))
      - pattern-not: System.err.print($BUNDLE.getString(...))
      - pattern-not: System.out.println($BUNDLE.getObject(...))
      - pattern-not: System.out.print($BUNDLE.getObject(...))
      # Allow println without arguments (blank lines)
      - pattern-not: System.out.println()
      - pattern-not: System.err.println()
    message: >-
      Use localized messages instead of hardcoded strings. 
      System.out.println() should use ResourceBundle.getString() or equivalent localization method.
      Example: System.out.println(messages.getString("key")) where messages is of type java.util.ResourceBundle
    metadata:
      category: codestyle
      subcategory: i18n
      description: Enforces use of ResourceBundle for all user-facing output to ensure proper internationalization
      technology:
        - java
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.js.i18n.no-hardcoded-alert-concat
    severity: WARNING
    languages:
      - js
      - ts
    pattern-either:
      # Direct hardcoded alert strings
      - pattern: alert("...")
      - pattern: window.alert("...")
      # String concatenation in alerts
      - pattern: alert("..." + ...)
      - pattern: alert(... + "...")
      - pattern: window.alert("..." + ...)
      - pattern: window.alert(... + "...")
    pattern-not: alert(t(...))
    message: >-
      Avoid hardcoded or concatenated strings in alerts. Use an i18n translation function (e.g., t("key")) with interpolation.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded and concatenated strings in alert dialogs to enforce localization
      technology:
        - javascript
        - typescript
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.js.i18n.no-hardcoded-locale-date
    severity: WARNING
    languages:
      - js
      - ts
    pattern-regex: "\\.(toLocale(Date|Time)?String)\\(\"[^\"]+\""
    message: Avoid hardcoded locale strings in date/time formatting.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags explicit locale strings in date/time formatting which can break localization
      technology:
        - javascript
        - typescript
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.js.i18n.no-hardcoded-number-format
    severity: WARNING
    languages:
      - js
      - ts
    pattern-regex: "\\.toFixed\\([^)]*\\)"
    message: >-
      Avoid using toFixed for user-visible number formatting. Use locale-aware formatting or translation helpers.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags toFixed used for UI number formatting; recommends locale-aware alternatives
      technology:
        - javascript
        - typescript
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.js.i18n.no-hardcoded-confirm-prompt
    severity: WARNING
    languages:
      - js
      - ts
    patterns:
      - pattern-either:
          - pattern: confirm("...")
          - pattern: window.confirm("...")
          - pattern: prompt("...")
          - pattern: window.prompt("...")
      - pattern-not: confirm(t(...))
      - pattern-not: prompt(t(...))
    message: >-
      Avoid hardcoded strings in confirm/prompt dialogs. Use an i18n translation function (e.g., t("key")) with interpolation.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded strings in confirm/prompt dialogs to enforce localization
      technology:
        - javascript
        - typescript
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.js.i18n.no-hardcoded-jsx-user-props
    severity: WARNING
    languages:
      - js
      - ts
    patterns:
      - pattern-either:
          - pattern: <$EL placeholder="$STR" ... />
          - pattern: <$EL alt="$STR" ... />
          - pattern: <$EL aria-label="$STR" ... />
          - pattern: <$EL label="$STR" ... />
          - pattern: <$EL title="$STR" ... />
      - metavariable-regex:
          metavariable: $STR
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|ERR)[^.]*\s[^.]*'
    message: >-
      Avoid hardcoded strings in JSX user-facing props. Use an i18n translation function (e.g., t("key")).
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded strings in JSX props like placeholder, alt, aria-label, label, and title
      technology:
        - javascript
        - typescript
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.js.i18n.no-hardcoded-console-error
    severity: WARNING
    languages:
      - js
      - ts
    patterns:
      - pattern: console.error("$MSG")
      - metavariable-regex:
          metavariable: $MSG
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|ERR)[^.]*\s[^.]*'
    message: >-
      Avoid hardcoded strings in console.error. Use an i18n translation function (e.g., t("key")).
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings in console.error calls
      technology:
        - javascript
        - typescript
      impact: MEDIUM
      confidence: LOW
      likelihood: MEDIUM

  - id: codacy.js.i18n.no-hardcoded-throw-error
    severity: WARNING
    languages:
      - js
      - ts
    patterns:
      - pattern: throw new Error("$MSG")
      - metavariable-regex:
          metavariable: $MSG
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|ERR)[^.]*\s[^.]*'
    message: >-
      Avoid hardcoded strings in Error constructors. Use an i18n translation function (e.g., t("key")).
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings in Error constructor calls
      technology:
        - javascript
        - typescript
      impact: MEDIUM
      confidence: LOW
      likelihood: MEDIUM

  - id: codacy.java.i18n.no-hardcoded-date-format
    severity: WARNING
    languages:
      - java
    pattern-either:
      - pattern: new SimpleDateFormat("...")
      - pattern: DateTimeFormatter.ofPattern("...")
    message: >-
      Avoid hardcoded date format patterns. Use DateTimeFormatter.ofLocalizedDate() or DateTimeFormatter.ofLocalizedDateTime() for locale-aware formatting.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded date format patterns that are not locale-aware
      technology:
        - java
      impact: MEDIUM
      confidence: HIGH
      likelihood: HIGH

  - id: codacy.java.i18n.no-hardcoded-decimal-format
    severity: WARNING
    languages:
      - java
    pattern-either:
      - pattern: new DecimalFormat("...")
      - patterns:
          - pattern: String.format("$FMT", ...)
          - metavariable-regex:
              metavariable: $FMT
              regex: '%[0-9.]*[fd]'
    message: >-
      Avoid hardcoded number format patterns. Use NumberFormat.getInstance(locale) or locale-aware formatting for user-visible numbers.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded decimal format patterns and String.format with numeric format specifiers
      technology:
        - java
      impact: MEDIUM
      confidence: MEDIUM
      likelihood: HIGH

  - id: codacy.java.i18n.no-hardcoded-exception-message
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern: throw new $EX("$MSG");
      - metavariable-regex:
          metavariable: $MSG
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|ERR)[^.]*\s[^.]*'
      - pattern-not: throw new $EX($BUNDLE.getString(...));
    message: >-
      Avoid hardcoded strings in exception messages. Use ResourceBundle.getString() or a localization key.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings in exception constructors
      technology:
        - java
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.java.i18n.no-hardcoded-return-string
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern: return "$STR";
      - metavariable-regex:
          metavariable: $STR
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|ERR)[^.]*\s[^.]*'
      - pattern-not: return $BUNDLE.getString(...);
    message: >-
      Avoid returning hardcoded natural language strings. Use ResourceBundle.getString() or a localization key.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings returned from methods
      technology:
        - java
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.java.i18n.no-hardcoded-string-concat
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern-either:
          - patterns:
              - pattern: return "$LIT" + ...;
              - metavariable-regex:
                  metavariable: $LIT
                  regex: '^[A-Z](?![a-z]+\[)[a-z].*'
          - patterns:
              - pattern: return ... + "$LIT";
              - metavariable-regex:
                  metavariable: $LIT
                  regex: '^\s(?!.*\b(?:SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|JOIN)\b).*[a-z]{2}'
      - pattern-not: return $BUNDLE.getString(...) + ...;
    message: >-
      Avoid hardcoded strings in string concatenation for user-facing output. Use ResourceBundle.getString() with MessageFormat.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings in return concatenation
      technology:
        - java
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.java.i18n.no-hardcoded-stringbuilder-append
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern: $SB.append("$STR");
      - metavariable-regex:
          metavariable: $STR
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|JOIN|ORDER)[^.]*\s[^.]*'
    message: >-
      Avoid hardcoded natural language strings in StringBuilder.append. Use ResourceBundle.getString() or MessageFormat.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings in StringBuilder.append calls
      technology:
        - java
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.js.i18n.no-raw-jsx-text
    severity: WARNING
    languages:
      - js
      - ts
    pattern-regex: "<(h1|h2|h3|h4|h5|h6|p|span|div|td|th)[^>]*>[^<{]*[A-Za-z][^<{]*</\\1>"
    message: >-
      Avoid raw text in JSX for user-facing content. Use i18n translation functions (e.g., t("key")) with interpolation.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags raw text nodes in JSX elements to enforce localization of UI strings
      technology:
        - javascript
        - typescript
      impact: MEDIUM
      confidence: LOW
      likelihood: MEDIUM

  - id: codacy.java.i18n.no-hardcoded-map-put
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern: $MAP.put("$KEY", "$VALUE");
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|ERR)[^.]*\s[^.]*'
      - pattern-not: $MAP.put("$KEY", $BUNDLE.getString(...));
    message: >-
      Avoid hardcoded strings in Map.put(). Use ResourceBundle.getString() or a localization key for user-facing messages.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings in Map.put() calls that should be localized
      technology:
        - java
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.java.i18n.no-hardcoded-map-of
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern-either:
          - pattern: Map.of(..., "$VALUE", ...)
          - pattern: Map.of("$KEY", "$VALUE")
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|ERR)[^.]*\s[^.]*'
      - pattern-not: Map.of(..., $BUNDLE.getString(...), ...)
    message: >-
      Avoid hardcoded strings in Map.of(). Use ResourceBundle.getString() or a localization key for user-facing messages.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings in Map.of() calls that should be localized
      technology:
        - java
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.java.i18n.no-hardcoded-response-body
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern-either:
          - pattern: ResponseEntity.ok(Map.of(..., "$VALUE", ...))
          - pattern: ResponseEntity.status(...).body(Map.of(..., "$VALUE", ...))
          - pattern: ResponseEntity.$METHOD(Map.of(..., "$VALUE", ...))
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^(?!SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|ERR)[^.]*\s[^.]*'
      - pattern-not: ResponseEntity.ok(Map.of(..., $BUNDLE.getString(...), ...))
      - pattern-not: ResponseEntity.status(...).body(Map.of(..., $BUNDLE.getString(...), ...))
    message: >-
      Avoid hardcoded strings in ResponseEntity body maps. Use ResourceBundle.getString() or a localization key for user-facing messages.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded natural language strings in Spring ResponseEntity responses that should be localized
      technology:
        - java
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.python.i18n.no-hardcoded-print-concat
    severity: WARNING
    languages:
      - python
    pattern-either:
      - pattern: print("..." + ...)
      - pattern: print(... + "...")
    message: >-
      Avoid hardcoded or concatenated strings in print. Use an i18n translation function (e.g., _("key")) with .format() or f-strings.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded string literals concatenated in print calls to enforce localization
      technology:
        - python
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.python.i18n.no-hardcoded-strftime
    severity: WARNING
    languages:
      - python
    pattern: $X.strftime("...")
    message: >-
      Avoid hardcoded date format strings in strftime. Use locale.nl_langinfo(locale.D_FMT) or similar locale-aware formatting.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded date format strings passed to strftime to enforce locale-aware date formatting
      technology:
        - python
      impact: MEDIUM
      confidence: HIGH
      likelihood: HIGH

  - id: codacy.python.i18n.no-hardcoded-number-format
    severity: WARNING
    languages:
      - python
    pattern-regex: ":\\.[0-9]+f"
    message: >-
      Avoid using :.Nf format specifiers for user-visible number formatting. Use locale.currency() or locale.format_string() for locale-aware formatting.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags :.Nf format specifiers in f-strings used for user-visible numbers instead of locale-aware formatting
      technology:
        - python
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.cpp.i18n.no-hardcoded-cout
    severity: WARNING
    languages:
      - cpp
    pattern: std::cout << "$MSG"
    message: >-
      Avoid hardcoded strings in std::cout. Use a localization function or resource bundle for user-facing output.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded string literals streamed directly to std::cout to enforce localization
      technology:
        - cpp
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH

  - id: codacy.cpp.i18n.no-hardcoded-strftime
    severity: WARNING
    languages:
      - cpp
    pattern-either:
      - pattern: std::strftime($BUF, $SIZE, "$FMT", $TIME);
      - pattern: strftime($BUF, $SIZE, "$FMT", $TIME);
    message: >-
      Avoid hardcoded date format strings in strftime. Use locale-aware date formatting (e.g., std::put_time with a locale-imbued stream).
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags hardcoded date format strings passed to strftime to enforce locale-aware date formatting
      technology:
        - cpp
      impact: MEDIUM
      confidence: HIGH
      likelihood: HIGH

  - id: codacy.cpp.i18n.no-hardcoded-number-format
    severity: WARNING
    languages:
      - cpp
    pattern: std::setprecision($N)
    message: >-
      Avoid using std::setprecision for user-visible number formatting. Imbue the stream with a locale and use std::use_facet<std::numpunct> for locale-aware output.
    metadata:
      category: codestyle
      subcategory: i18n
      description: Flags std::setprecision used for user-visible number formatting instead of locale-aware alternatives
      technology:
        - cpp
      impact: MEDIUM
      confidence: LOW
      likelihood: HIGH
