on: push
env:
  WF_SECRET: ${{ secrets.WF_KEY }}
  WF_PLAIN: 1
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JOB_TOKEN: ${{ secrets.DEMO_SECRET }}
      JOB_PLAIN: 2
    steps:
      # ruleid: github-actions-secret-env-used-in-scope
      - name: job-level binding used in same job
        run: echo "$JOB_TOKEN" | base64
      # ok: github-actions-secret-env-used-in-scope
      - name: job-level name not bound to a secret
        run: echo "$JOB_PLAIN"
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ok: github-actions-secret-env-used-in-scope
      - name: job-level name is not bound in another job
        run: echo "$JOB_TOKEN" | base64
      # ruleid: github-actions-secret-env-used-in-scope
      - name: workflow-level binding used in another job
        run: echo "$WF_SECRET" | base64
      # ok: github-actions-secret-env-used-in-scope
      - name: workflow-level name not bound to a secret
        run: echo "$WF_PLAIN"
  quoted-job:
    runs-on: ubuntu-latest
    env:
      QUOTED_JOB_TOKEN: "${{ secrets.DEMO_SECRET }}"
    steps:
      # ruleid: github-actions-secret-env-used-in-scope
      - run: echo "$QUOTED_JOB_TOKEN"
