on: push
env:
  WF_SECRET: ${{ secrets.WF_KEY }}
  WF_PLAIN: 1
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JOB_TOKEN: ${{ secrets.FIXTURE_KEY }}
    steps:
      # ruleid: secret-in-run
      - run: printf "%s" "${{ secrets.FIXTURE_KEY }}" | xxd
      # ruleid: secret-dump
      - run: echo '${{ toJSON(secrets) }}' | jq .
      # ruleid: secret-in-run
      - run: echo ${{ secrets.FIXTURE_KEY }} | sed 's/./& /g'
      # ruleid: secret-in-run
      - run: echo "${{ secrets.FIXTURE_KEY }}" | tee key.txt
      # ruleid: secret-in-run
      - run: |
          flutter build apk \
            --dart-define=API_KEY=${{ secrets.FIXTURE_KEY }} \
            --release
      # ok: secret-in-run
      - run: echo "plain text, no secret"
      # ruleid: secret-env-alias-in-run
      - name: credential helper
        env:
          FIXTURE_TOKEN: ${{ secrets.FIXTURE_KEY }}
        run: |
          git config --global credential.https://example.invalid.helper '!f() { if [ "$1" = get ]; then printf "username=token\npassword=%s\n" "$FIXTURE_TOKEN"; fi; }; f'
      # ruleid: secret-env-alias-in-run
      - name: write token to file
        env:
          FIXTURE_TOKEN: ${{ secrets.FIXTURE_KEY }}
        run: |
          echo "$FIXTURE_TOKEN" > token.txt 2> error.log
      # ruleid: secret-env-alias-in-run
      - name: base64 of token
        env:
          FIXTURE_TOKEN: ${{ secrets.FIXTURE_KEY }}
        run: echo "$FIXTURE_TOKEN" | base64
      # ruleid: secret-env-alias-in-run
      - name: reversed token
        env:
          FIXTURE_TOKEN: ${{ secrets.FIXTURE_KEY }}
        run: rev <<< "${FIXTURE_TOKEN}"
      # ok: secret-env-alias-in-run
      - name: print a different variable
        env:
          FIXTURE_TOKEN: ${{ secrets.FIXTURE_KEY }}
        run: echo "$BUILD_ID"
      # ok: secret-env-alias-in-run
      - name: prefix of the bound name
        env:
          FIXTURE_TOKEN: ${{ secrets.FIXTURE_KEY }}
        run: echo "$FIXTURE_TOKENX"
      # ok: secret-env-alias-in-run
      - name: bound to a non-secret
        env:
          BUILD: 42
        run: echo "$BUILD"
      # ok: secret-env-alias-in-run
      - name: binding not used in run
        env:
          FIXTURE_TOKEN: ${{ secrets.FIXTURE_KEY }}
        uses: example/action@0000000000000000000000000000000000000000
      # ruleid: secret-env-alias-scoped-in-run
      - name: job-level binding used in same job
        run: echo "$JOB_TOKEN" | base64
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ok: secret-env-alias-scoped-in-run
      - name: job-level name is not bound in another job
        run: echo "$JOB_TOKEN" | base64
      # ruleid: secret-env-alias-scoped-in-run
      - name: workflow-level binding used in another job
        run: echo "$WF_SECRET" | base64
      # ok: secret-env-alias-scoped-in-run
      - name: workflow-level name not bound to a secret
        run: echo "$WF_PLAIN"
