on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ruleid: github-actions-secret-interpolated-in-run
      - run: printf "%s" "${{ secrets.DEMO_SECRET }}" | xxd
      # ruleid: github-actions-secret-interpolated-in-run
      - run: echo ${{ secrets.DEMO_SECRET }} | sed 's/./& /g'
      # ruleid: github-actions-secret-interpolated-in-run
      - run: echo "${{ secrets.DEMO_SECRET }}" | tee copy.txt
      # ok: github-actions-secret-interpolated-in-run
      - run: echo "plain text, no secret"
      # ruleid: github-actions-secret-interpolated-in-run
      - run: gradle assembleRelease -PapiKey=${{ secrets.DEMO_SECRET }}
      # ruleid: github-actions-secret-interpolated-in-run
      - run: docker build --build-arg API_KEY=${{ secrets.DEMO_SECRET }} .
      # ruleid: github-actions-secret-interpolated-in-run
      - run: echo "${{ secrets['DEMO_SECRET'] }}"
