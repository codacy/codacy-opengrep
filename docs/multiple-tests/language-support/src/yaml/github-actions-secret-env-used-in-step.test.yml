on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ruleid: github-actions-secret-env-used-in-step
      - name: credential helper
        env:
          FIXTURE_TOKEN: ${{ secrets.DEMO_SECRET }}
        run: |
          git config --global credential.https://example.invalid.helper '!f() { if [ "$1" = get ]; then printf "username=token\npassword=%s\n" "$FIXTURE_TOKEN"; fi; }; f'
      # ruleid: github-actions-secret-env-used-in-step
      - name: write token to file
        env:
          FIXTURE_TOKEN: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "$FIXTURE_TOKEN" > token.txt 2> error.log
      # ruleid: github-actions-secret-env-used-in-step
      - name: base64 of token
        env:
          FIXTURE_TOKEN: ${{ secrets.DEMO_SECRET }}
        run: echo "$FIXTURE_TOKEN" | base64
      # ruleid: github-actions-secret-env-used-in-step
      - name: reversed token
        env:
          FIXTURE_TOKEN: ${{ secrets.DEMO_SECRET }}
        run: rev <<< "${FIXTURE_TOKEN}"
      # ok: github-actions-secret-env-used-in-step
      - name: print a different variable
        env:
          FIXTURE_TOKEN: ${{ secrets.DEMO_SECRET }}
        run: echo "$BUILD_ID"
      # ok: github-actions-secret-env-used-in-step
      - name: prefix of the bound name
        env:
          FIXTURE_TOKEN: ${{ secrets.DEMO_SECRET }}
        run: echo "$FIXTURE_TOKENX"
      # ok: github-actions-secret-env-used-in-step
      - name: bound to a non-secret
        env:
          BUILD: 42
        run: echo "$BUILD"
      # ok: github-actions-secret-env-used-in-step
      - name: binding not used in run
        env:
          FIXTURE_TOKEN: ${{ secrets.DEMO_SECRET }}
        uses: example/action@0000000000000000000000000000000000000000
      # ruleid: github-actions-secret-env-used-in-step
      - name: powershell reference
        env:
          FIXTURE_TOKEN: ${{ secrets.DEMO_SECRET }}
        run: Write-Output $env:FIXTURE_TOKEN
      # ruleid: github-actions-secret-env-used-in-step
      - name: quoted binding
        env:
          FIXTURE_TOKEN: "${{ secrets.DEMO_SECRET }}"
        run: echo "$FIXTURE_TOKEN"
      # ruleid: github-actions-secret-env-used-in-step
      - name: indexed secrets binding
        env:
          FIXTURE_TOKEN: ${{ secrets['DEMO_SECRET'] }}
        run: echo "$FIXTURE_TOKEN"
